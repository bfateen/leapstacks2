                }
            }

            async function cancelAutoDelete(id, executionArn) {
                const output = document.getElementById('output');
                const apiUrl = 'https://${ApiGatewayRestApi}.execute-api.${AWS::Region}.amazonaws.com/prod/cancel-auto-delete';
                
                try {
                    const response = await fetch(apiUrl, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ executionArn: executionArn }),
                    });
                    const data = await response.json();
                    if (response.ok) {
                        output.innerHTML = 'Auto-delete cancelled successfully';
                        
                        // Clear the timer and update state
                        var pindex = 0;
                        for (var i = 0; i < prototypes.length; i++) {
                            if (prototypes[i]['id'] == id) {
                                pindex = i;
                                prototypes[i]['autoDeleteEnabled'] = false;
                                prototypes[i]['deletetimer'] = null;
                                prototypes[i]['executionArn'] = null;
                                fulldata['prototypes'] = prototypes;
                                saveToLocalStorage('myAppState', fulldata);
                                break;
                            }
                        }
                        
                        // Hide the timer display
                        $('.prototype-card[data-id="' + id + '"] .timerdiv').html('<span style="color: green;">Auto-delete cancelled</span>');
                        
                    } else {
                        throw new Error(data.error || 'Unknown error occurred');
                    }
                } catch (error) {
                    output.innerHTML = 'Error: ' + error.message;
                    alert('Failed to cancel auto-delete: ' + error.message);
                }
            }

            function startCountdownTimer(pid, starttime = null) {
                let countDownDate = starttime ? starttime : new Date().getTime() + (2 * 60 * 60 * 1000);
                
                // CHANGED: Use 'span' instead of 'div' to keep it inline
                let timerElement = document.createElement('span');
                timerElement.className = 'countdown-timer';
                timerElement.style.fontSize = '0.8rem'; // Matches "Active" text size
                
                // CHANGED: Use theme variable instead of 'black' and add margin
                timerElement.style.color = 'var(--text-secondary)';
                timerElement.style.marginLeft = '15px';
                
                timerElement.style.cursor = 'pointer';
                timerElement.title = 'Click to cancel auto-delete';
                
                // Add click handler
                timerElement.onclick = function() {
                    const prototype = prototypes.find(p => p.id === pid);
                    if (prototype && prototype.executionArn) {
                        if (confirm('Are you sure you want to cancel the auto-delete timer? Your stack will remain active until you manually delete it.')) {
                            cancelAutoDelete(pid, prototype.executionArn);
                        }
                    } else {
                        alert('Unable to cancel auto-delete. Execution information not found.');
                    }
                };
                
                $('.prototype-card[data-id="' + pid + '"] .timerdiv').html(timerElement);
                
                // 1. Assign the interval to a variable
                let timer = setInterval(function() {
                    // 2. SAFETY CHECK: Look up the prototype status every tick
                    var currentProto = prototypes.find(p => p.id == pid);
                    
                    // If the prototype is gone or auto-delete was disabled (cancelled), STOP.
                    if (!currentProto || currentProto.autoDeleteEnabled === false) {
                        clearInterval(timer);
                        return;
                    }

                    let now = new Date().getTime();
                    let distance = countDownDate - now;
                    
                    let hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                    let minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
                    let seconds = Math.floor((distance % (1000 * 60)) / 1000);
                    
                    // Only update UI if the element is still in the DOM
                    if (document.body.contains(timerElement)) {
                        timerElement.innerHTML = '<i class="fa-regular fa-clock"></i> Auto-deletes in: ' + hours + 'h ' + minutes + 'm ' + seconds + 's (click to cancel)';
                    }
                    
                    if (distance < 0) {
                        clearInterval(timer);
                        // Double check permission before deleting
                        if (currentProto.autoDeleteEnabled !== false) {
                            timerElement.innerHTML = "Initiating auto-delete...";
                            let stackName = $('.prototype-card[data-id="' + pid + '"]').attr('data-stackname');
                            deleteStack(stackName, pid);
                        }
                    }
                }, 1000);

                // 3. Store timer ID in the prototype object so we can access it externally if needed
                var pindex = prototypes.findIndex(p => p.id == pid);
                if(pindex >= 0) {
                    // Clear any existing timer for this prototype to prevent duplicates
                    if(prototypes[pindex].intervalId) clearInterval(prototypes[pindex].intervalId);
                    prototypes[pindex].intervalId = timer;
                }
            }

            async function deleteStack(stackName,id) {
                $('.prototype-card[data-id="' + id + '"]').find('.status-msg').html('Deleting...');
                // Hide active elements
                $('.prototype-card[data-id="' + id + '"]').find('.deployment-info').hide();
                $('.prototype-card[data-id="' + id + '"]').removeClass('active');

                const card = $('.prototype-card[data-id="' + id + '"]');
                const statusMsg = card.find('.status-msg');
    
                // Show deleting status
                statusMsg.html('Deleting stack...');
                
                const apiUrl = 'https://${ApiGatewayRestApi}.execute-api.${AWS::Region}.amazonaws.com/prod/delete-stack';
                try {
                    const initiateResponse = await fetch(apiUrl, {
                        method: 'POST',
                        body: JSON.stringify({ stackName: stackName}),
                    });
                    if (initiateResponse.ok) checkStatus(stackName, id);
                } catch (error) { console.log(error); }
            }

            async function checkStatus(stackName, pid) {
                const output = document.getElementById('output');
                const apiUrl = 'https://${ApiGatewayRestApi}.execute-api.${AWS::Region}.amazonaws.com/prod/check-status';
                try {
                    while (true) {
                        const statusResponse = await fetch(apiUrl, { method: 'POST', body: JSON.stringify({ stackName: stackName }) });
                        const statusData = await statusResponse.json();
                        
                        if (statusResponse.ok) {
                            if (statusData.status.endsWith('_COMPLETE') || statusData.status.endsWith('_FAILED')) {
                                
                                if (!statusData.status.includes('DELETE')) {
                                    launching = false; 
                                }

                                var pindex = prototypes.findIndex(p => p.id == pid);

                              
                                if (statusData.status === 'CREATE_COMPLETE' || statusData.status === 'UPDATE_COMPLETE') {
                                    // DEPLOYMENT SUCCESS
                                    prototypes[pindex]['launching'] = false;  // ADDED
                                    prototypes[pindex]['pendingStackName'] = null;  // ADDED
                                    prototypes[pindex]['outputs'] = statusData.outputs;
                                    if (statusData.outputs) {
                                        var outputs = statusData.outputs;
                                        for (var key in outputs) {
                                            if (key == "FrontendURL") prototypes[pindex]['frontend'] = outputs[key];
                                            if (key == "DynamoDBTableName") prototypes[pindex]['metricsdb'] = outputs[key];
                                        }
                                    }
                                    PrototypeDeployed(pid, pindex);
                                    saveToLocalStorage('myAppState', fulldata);
                                    
                                    if (autodestroy) {
                                        selfdestructStack(stackName, pid);
                                        startCountdownTimer(pid);
                                    }
                                } 
                                // 3. DELETE CHECK
                                else if (statusData.status.includes('DELETE')) {
                                    // DELETION COMPLETE
                                    prototypes[pindex]['launching'] = false;  // ADDED
                                    prototypes[pindex]['pendingStackName'] = null; 
                                    PrototypeDeleted(pid, pindex);
                                    saveToLocalStorage('myAppState', fulldata);
                                } 
                                // 4. FAILURE HANDLING (Rollback, Create Failed, etc.)
                                else {
                                    // The stack failed to create (e.g. ROLLBACK_COMPLETE).
                                    // Reset UI to inactive so the user can try again.
                                    var errorMsg = statusData.error || ('Deployment failed with status: ' + statusData.status);
                                    console.log(errorMsg); // Log error to console

                                    prototypes[pindex]['launching'] = false;  // ADDED
                                    prototypes[pindex]['pendingStackName'] = null; 
                                    
                                    PrototypeDeleted(pid, pindex);
                                    
                                    const card = $('.prototype-card[data-id="' + pid + '"]');
                                    card.find('.status-msg').html('<span style="color:var(--accent-red)">Creation Failed (' + statusData.status + ')</span>');
                                    
                                    saveToLocalStorage('myAppState', fulldata);
                                }
                                break;
                            }
                        } else if (statusData.error && statusData.error.includes('does not exist')) {
                             // Stack is gone (likely deleted manually via console or finished deleting)
                             var pindex = prototypes.findIndex(p => p.id == pid);
                             PrototypeDeleted(pid, pindex);
                             saveToLocalStorage('myAppState', fulldata);
                             break;
                        }
                        await new Promise(resolve => setTimeout(resolve, 5000));
                    }
                } catch (error) { console.log(error); }
            }

            function fetchStats(prototypeId) {
             try {
                const card = $('.prototype-card[data-id="' + prototypeId + '"]');
                const prototype = prototypes.find(p => p.id === prototypeId);
                const dynamoTableName = prototype?.outputs?.DynamoDBTableName;
                
                if (!dynamoTableName) {
                    console.log('No DynamoDB table for prototype ' + prototypeId);
                    return;
                }
                
                // Check if prototype is still active
                if (!prototype.active) {
                    console.log('Prototype ' + prototypeId + ' is not active, skipping stats');
                    return;
                }
                
                fetch('https://${ApiGatewayRestApi}.execute-api.${AWS::Region}.amazonaws.com/prod/get-stats', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ tableName: dynamoTableName })
                })
                .then(response => {
                    if (!response.ok) {
                        throw new Error('Stats API error: ' + response.status);
                    }
                    return response.json();
                })
                .then(data => {
                    // Validate data exists and has no errors
                    if (!data || data.error) {
                        console.log('Invalid stats data for ' + prototypeId + ':', data);
                        return;
                    }
                    
                    // Update UI with safe defaults
                    card.find('.message-count').text(data.message_count || 0);
                    card.find('.total-cost').text('$' + (data.total_cost_usd || 0).toFixed(4));
                    card.find('.avg-cost').text('$' + (data.average_cost_per_message || 0).toFixed(4));
                    card.find('.avg-latency').text(Math.round(data.average_latency_ms || 0) + 'ms');
                })
                .catch(error => {
                    console.log('Stats fetch error for ' + prototypeId + ':', error);
                });

                } catch (error) { console.log('fetchStats error:', error); }
            }
            
            function trackStats() {
                statsInterval = setInterval(() => {
                    prototypes.forEach(prototype => { 
                        // Only fetch stats if prototype is active
                        if (prototype.active && prototype.outputs && prototype.outputs.DynamoDBTableName) {
                            fetchStats(prototype.id);
                        }
                    });
                }, 8000);
            }

