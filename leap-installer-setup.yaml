            function LinkExplainers(words) {
                var explainers = appinfo["explainers"];
                if(explainers) {
                    explainers.forEach(function (explainer,index) {
                        var term = explainer.term;
                        // Escape regex chars for the primary term
                        var escapedTerm = term.replace(/[.*+?^{}$()|[\]\\]/g, '\\$&');
                        var regex = new RegExp('\\b' + escapedTerm + '\\b', 'gi');
                        var found = false;

                        // Check if primary term exists
                        if (words.search(regex) !== -1) {
                            words = words.replace(regex, function (match) {
                                found = true;
                                return '<a href="#" class="explainer-link" style="color:var(--accent-blue);text-decoration:none" data-index="' + index + '">' + match + '</a>';
                            });
                        }
                        
                        // If primary term was NOT found, try the alternate term
                        if (!found && explainer.term_alt) {
                            var termAlt = explainer.term_alt;
                            var escapedTermAlt = termAlt.replace(/[.*+?^{}$()|[\]\\]/g, '\\$&');
                            var regexAlt = new RegExp('\\b' + escapedTermAlt + '\\b', 'gi');
                            
                            words = words.replace(regexAlt, function (match) {
                                return '<a href="#" class="explainer-link" style="color:var(--accent-blue);text-decoration:none" data-index="' + index + '">' + match + '</a>';
                            });
                        }
                    });
                }
                return words;
            }

