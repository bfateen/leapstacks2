            function expiredmedia(img, src) {
                // Logic to regenerate signed URLs if expired
                const isSigV2 = src && (src.includes('Signature=') || src.includes('AWSAccessKeyId='));
                const isSigV4 = src && src.includes('X-Amz-Signature');
                if (isSigV2 || isSigV4) {
                    const match = src.match(/amazonaws\.com\/([^?]+)/);
                    if (match) {
                        const key = decodeURIComponent(match[1]);
                        $.ajax({
                            url: 'https://${ApiGatewayRestApi}.execute-api.${AWS::Region}.amazonaws.com/prod/regenerate-urls',
                            method: 'POST',
                            contentType: 'application/json',
                            data: JSON.stringify({ keys: [key] }),
                            success: function (response) {
                                if (response.assets && response.assets[key]) {
                                    img.attr('src', response.assets[key]);
                                    updateStoredUrl(key, response.assets[key]);
                                }
                            }
                        });
                    }
                }
            }

            function updateStoredUrl(s3Key, newUrl) {
                if(!prototypes) return;
                prototypes.forEach(prototype => {
                    if (prototype.iconurl && prototype.iconurl.includes(s3Key)) prototype.iconurl = newUrl;
                    if (prototype.videoUrl && prototype.videoUrl.includes(s3Key)) prototype.videoUrl = newUrl;
                });
                if (fulldata) saveToLocalStorage('myAppState', fulldata);
            }
            
