  RegenerateUrlsFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: RegeneratePresignedUrls
      Handler: index.handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Runtime: python3.11
      Timeout: 60
      Code:
        ZipFile: |
          import json
          import boto3
          import os
          from typing import Dict, List, Any
          from botocore.config import Config
          
          def handler(event, context):
              region = os.environ.get('AWS_REGION', 'us-east-1')

              s3 = boto3.client(
                  's3',
                  region_name=region,
                  config=Config(
                      signature_version='s3v4',
                      s3={'addressing_style': 'virtual'}
                  )
              )
              cfn = boto3.client('cloudformation')
              bucket_name = os.environ['BUCKET_NAME']
              
              headers = {
                'Access-Control-Allow-Origin': '*',
                'Access-Control-Allow-Headers': 'Content-Type,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token',
                'Access-Control-Allow-Methods': 'OPTIONS,POST',
                'Content-Type': 'application/json'
              }
              
              try:
                  if event.get('httpMethod') == 'OPTIONS':
                    return {
                        'statusCode': 200,
                        'headers': headers,
                        'body': ''
                    }

                  body = json.loads(event.get('body', '{}'))
                  
                  # Support both legacy and new request formats
                  s3_keys = body.get('keys', [])
                  stack_names = body.get('stacks', [])
                  refresh_type = body.get('type', 'assets')
                  
                  result = {
                      'assets': {},
                      'stacks': {}
                  }
                  
                  # Regenerate S3 asset URLs (legacy behavior)
                  if refresh_type in ['assets', 'both'] and s3_keys:
                      result['assets'] = regenerate_asset_urls(s3, bucket_name, s3_keys)
                  
                  # Regenerate stack frontend URLs (new functionality)
                  if refresh_type in ['stacks', 'both'] and stack_names:
                      result['stacks'] = regenerate_stack_urls(s3, cfn, stack_names)
                  
                  return {
                      'statusCode': 200,
                      'headers': headers,
                      'body': json.dumps(result)
                  }
                  
              except Exception as e:
                  print(f"Error in RegenerateUrlsFunction: {str(e)}")
                  return {
                      'statusCode': 500,
                      'headers': headers,
                      'body': json.dumps({'error': str(e)})
                  }
          
          def regenerate_asset_urls(s3_client, bucket_name: str, s3_keys: List[str]) -> Dict[str, str]:
              """Regenerate presigned URLs for S3 assets"""
              regenerated_urls = {}
              
              for key in s3_keys:
                  try:
                      url = s3_client.generate_presigned_url(
                          'get_object',
                          Params={
                              'Bucket': bucket_name,
                              'Key': key
                          },
                          ExpiresIn=604800
                      )
                      regenerated_urls[key] = url
                  except Exception as e:
                      print(f"Failed to regenerate URL for {key}: {str(e)}")
                      regenerated_urls[key] = f"ERROR: {str(e)}"
              
              return regenerated_urls
          
          def regenerate_stack_urls(s3_client, cfn_client, stack_names: List[str]) -> Dict[str, Dict[str, Any]]:
              """Regenerate frontend URLs for deployed stacks"""
              stack_urls = {}
              
              for stack_name in stack_names:
                  try:
                      stack_info = get_stack_outputs(cfn_client, stack_name)
                      print(f"Stack info for {stack_name}: {stack_info}")
                      
                      if stack_info['status'] == 'ACTIVE':
                          bucket_name = stack_info.get('bucket_name')
                          s3_key = stack_info.get('s3_key', 'index.html')
                          
                          print(f"Bucket: {bucket_name}, Key: {s3_key}")
                          
                          if bucket_name:
                              try:
                                  # Verify the object exists first
                                  try:
                                      s3_client.head_object(Bucket=bucket_name, Key=s3_key)
                                      print(f"Object verified: s3://{bucket_name}/{s3_key}")
                                  except Exception as head_error:
                                      print(f"Object does not exist: s3://{bucket_name}/{s3_key} - {str(head_error)}")
                                      raise Exception(f"S3 object not found: {bucket_name}/{s3_key}")
                                  
                                  new_url = s3_client.generate_presigned_url(
                                      'get_object',
                                      Params={
                                          'Bucket': bucket_name,
                                          'Key': s3_key
                                      },
                                      ExpiresIn=604800
                                  )
                                  print(f"Generated URL: {new_url}")
                                  
                                  stack_urls[stack_name] = {
                                      'frontend_url': new_url,
                                      'backend_url': stack_info.get('backend_url'),
                                      'status': 'SUCCESS',
                                      'expires_in_days': 7,
                                      'custom_outputs': stack_info.get('custom_outputs', {})
                                  }
                              except Exception as e:
                                  stack_urls[stack_name] = {
                                      'status': 'ERROR',
                                      'error': f"Failed to generate presigned URL: {str(e)}"
                                  }
                          else:
                              stack_urls[stack_name] = {
                                  'status': 'ERROR',
                                  'error': 'No S3 bucket found in stack outputs'
                              }
                      else:
                          stack_urls[stack_name] = {
                              'status': stack_info['status'],
                              'error': stack_info.get('error', 'Stack not in active state')
                          }
                          
                  except Exception as e:
                      print(f"Failed to process stack {stack_name}: {str(e)}")
                      stack_urls[stack_name] = {
                          'status': 'ERROR',
                          'error': str(e)
                      }
              
              return stack_urls
          
          def get_stack_outputs(cfn_client, stack_name: str) -> Dict[str, Any]:
              """Get stack outputs including S3 bucket and other URLs"""
              try:
                  response = cfn_client.describe_stacks(StackName=stack_name)
                  
                  if not response.get('Stacks'):
                      return {
                          'status': 'NOT_FOUND',
                          'error': 'Stack does not exist'
                      }
                  
                  stack = response['Stacks'][0]
                  stack_status = stack['StackStatus']
                  
                  if not stack_status.endswith('_COMPLETE'):
                      return {
                          'status': stack_status,
                          'error': f'Stack is in {stack_status} state'
                      }
                  
                  outputs = {}
                  if 'Outputs' in stack:
                      for output in stack['Outputs']:
                          outputs[output['OutputKey']] = output['OutputValue']
                  
                  # PRIORITY 1: Extract bucket from FrontendURL (most reliable)
                  bucket_name = None
                  s3_key = 'index.html'
                  frontend_url = outputs.get('FrontendURL', '')
                  
                  print(f"FrontendURL: {frontend_url}")
                  
                  if frontend_url and '.s3.' in frontend_url or '.s3.amazonaws.com' in frontend_url:
                      try:
                          import re
                          # Pattern 1: https://BUCKET.s3.region.amazonaws.com/KEY or https://BUCKET.s3.amazonaws.com/KEY
                          match1 = re.match(r'https://([^.]+)\.s3\.', frontend_url)
                          if match1:
                              bucket_name = match1.group(1)
                              print(f"Extracted bucket from FrontendURL (virtual-hosted): {bucket_name}")
                          else:
                              # Pattern 2: https://s3.REGION.amazonaws.com/BUCKET/KEY
                              match2 = re.match(r'https://s3\.[^.]+\.amazonaws\.com/([^/?]+)', frontend_url)
                              if match2:
                                  bucket_name = match2.group(1)
                                  print(f"Extracted bucket from FrontendURL (path-style): {bucket_name}")
                          
                          # Extract S3 key from URL
                          url_without_params = frontend_url.split('?')[0]
                          if '/' in url_without_params:
                              key_part = url_without_params.split('/')[-1]
                              if key_part and key_part != bucket_name:
                                  s3_key = key_part
                                  print(f"Extracted S3 key from URL: {s3_key}")
                      except Exception as e:
                          print(f"Error extracting from FrontendURL: {str(e)}")
                  
                  # PRIORITY 2: Fallback to S3BucketName output (only if FrontendURL extraction failed)
                  if not bucket_name:
                      bucket_name = outputs.get('S3BucketName')
                      if bucket_name:
                          print(f"Using S3BucketName output: {bucket_name}")
                  
                  # PRIORITY 3: Try FrontendBucketName output
                  if not bucket_name:
                      bucket_name = outputs.get('FrontendBucketName')
                      if bucket_name:
                          print(f"Using FrontendBucketName output: {bucket_name}")
                  
                  print(f"Final bucket_name: {bucket_name}, s3_key: {s3_key}")
                  
                  result = {
                      'status': 'ACTIVE',
                      'bucket_name': bucket_name,
                      's3_key': s3_key,
                      'backend_url': outputs.get('BackendURL') or outputs.get('ApiEndpoint'),
                      'custom_outputs': {}
                  }
                  
                  for key, value in outputs.items():
                      if key not in ['S3BucketName', 'FrontendBucketName', 'BackendURL', 'ApiEndpoint', 'FrontendURL']:
                          result['custom_outputs'][key] = value
                  
                  return result
                  
              except cfn_client.exceptions.ClientError as e:
                  if e.response['Error']['Code'] == 'ValidationError':
                      return {
                          'status': 'NOT_FOUND',
                          'error': str(e)
                      }
                  raise
      Environment:
        Variables:
          BUCKET_NAME: !Ref WebsiteBucket

