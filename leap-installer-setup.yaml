  CancelAutoDeleteFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: CancelAutoDeleteFunction
      Handler: index.handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Code:
        ZipFile: |
          import boto3
          import json
          import logging

          logger = logging.getLogger()
          logger.setLevel(logging.INFO)

          def handler(event, context):
              sfn = boto3.client('stepfunctions')
              
              headers = {
                  'Access-Control-Allow-Origin': '*',
                  'Access-Control-Allow-Headers': 'Content-Type',
                  'Access-Control-Allow-Methods': 'OPTIONS,POST'
              }
              
              try:
                  body = json.loads(event['body'])
                  execution_arn = body.get('executionArn')
                  
                  if not execution_arn:
                      raise ValueError("executionArn must be provided")
                      
                  logger.info(f"Stopping execution: {execution_arn}")
                  
                  # Stop the Step Functions execution
                  response = sfn.stop_execution(
                      executionArn=execution_arn,
                      error='UserCancelled',
                      cause='User cancelled auto-delete timer'
                  )
                  
                  logger.info(f"Execution stopped successfully: {execution_arn}")
                  
                  return {
                      'statusCode': 200,
                      'headers': headers,
                      'body': json.dumps({
                          'message': 'Auto-delete cancelled successfully',
                          'executionArn': execution_arn
                      })
                  }
                  
              except Exception as e:
                  logger.error(f"Error: {str(e)}")
                  return {
                      'statusCode': 500,
                      'headers': headers,
                      'body': json.dumps({'error': str(e)})
                  }
      Runtime: python3.8
      Timeout: 30

