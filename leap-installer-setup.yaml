                    if (v.guide) guideHtml = '<a href="' + v.guide + '" target="_blank" class="guide-link" style="color:var(--accent-blue);font-size:0.8rem;display:block;margin-top:4px"><i class="fa fa-external-link"></i> Where do I find this?</a>';
                    var html = '<div class="input-group" style="margin-bottom:15px">' +
                        '<label for="' + v.id + '" style="display:block;color:var(--text-secondary);margin-bottom:5px">' + v.title + '</label>' +
                        '<input type="text" id="' + v.id + '" name="' + v.id + '" required placeholder="Enter value..." style="width:100%;padding:10px;border-radius:6px;border:1px solid var(--border-color);background:var(--bg-primary);color:white" />' +
                        guideHtml + '</div>';
                    container.append(html);
                });
                $('#variable-input-overlay').css('display', 'flex').hide().fadeIn();
            }

            function showModalCustom(title, content) {
                $('.models-table').hide();
                $('.modal-popup').css('maxWidth','700px');
                document.getElementById('modal-title').textContent = title;
                document.getElementById('modal-message').innerHTML = content;
                document.getElementById('overlay').style.display = 'flex';
            }

            function showModal(title, message, models) {
                $('.models-table').show();
                document.getElementById('modal-title').innerHTML = title;
                document.getElementById('modal-message').textContent = message;
                const modelsList = document.getElementById('models-list');
                modelsList.innerHTML = '';
                models.forEach(model => {
                    const row = document.createElement('tr');
                    var statusColor = model.enabled ? 'var(--accent-green)' : 'var(--accent-red)';
                    var statusText = model.enabled ? 'Enabled' : 'Not Enabled';
                    var actionHtml = !model.enabled ? '<a href="' + model.url + '" target="_blank" class="signup-btn" style="font-size:0.8rem">Enable</a>' : '';
                    row.innerHTML = '<td>' + model.name + '</td>' +
                        '<td style="color:' + statusColor + '">' + statusText + '</td>' ;
                        
                    modelsList.appendChild(row);
                });
                document.getElementById('overlay').style.display = 'flex';
