  # ============================================================================
  # KIRO IDE INTEGRATION - Generate downloadable Kiro project bundles
  # ============================================================================
  
  GenerateKiroProjectRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${StackCode}-kiro-generator-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: KiroProjectGeneratorPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - cloudformation:DescribeStacks
                  - cloudformation:ListStackResources
                  - cloudformation:GetTemplate
                Resource: '*'
              - Effect: Allow
                Action:
                  - lambda:GetFunction
                  - lambda:GetFunctionConfiguration
                Resource: '*'

  GenerateKiroProjectFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub ${StackCode}-generate-kiro-project
      Description: Generates downloadable Kiro IDE project bundles for LEAP stacks
      Handler: index.handler
      Role: !GetAtt GenerateKiroProjectRole.Arn
      Runtime: python3.11
      Timeout: 60
      MemorySize: 256
      Code:
        ZipFile: |
          import json,boto3,zipfile,io,base64
          from datetime import datetime
          def handler(event,context):
              headers={'Access-Control-Allow-Origin':'*','Access-Control-Allow-Headers':'Content-Type','Access-Control-Allow-Methods':'OPTIONS,POST'}
              if event.get('httpMethod')=='OPTIONS':return{'statusCode':200,'headers':headers,'body':''}
              try:
                  body=json.loads(event.get('body','{}'));stack_name=body.get('stackName');proto=body.get('prototypeInfo',{})
                  if not stack_name:return{'statusCode':400,'headers':headers,'body':json.dumps({'error':'stackName required'})}
                  cfn=boto3.client('cloudformation');region=boto3.session.Session().region_name
                  stack=cfn.describe_stacks(StackName=stack_name)['Stacks'][0]
                  outputs={o['OutputKey']:o['OutputValue']for o in stack.get('Outputs',[])}
                  params={p['ParameterKey']:p.get('ParameterValue','')for p in stack.get('Parameters',[])}
                  resources=cfn.list_stack_resources(StackName=stack_name)['StackResourceSummaries']
                  try:tpl=cfn.get_template(StackName=stack_name).get('TemplateBody','');tpl=json.dumps(tpl,indent=2)if isinstance(tpl,dict)else tpl
                  except:tpl='# Template not accessible'
                  rt={r['ResourceType']for r in resources};arch='serverless'if'AWS::Lambda::Function'in rt else'ec2'if'AWS::EC2::Instance'in rt else'ecs'if'AWS::ECS::Service'in rt else'other'
                  ai=['Bedrock']if any('bedrock'in str(r).lower()for r in resources)else[]
                  net=[];
                  if'AWS::ApiGateway::RestApi'in rt or'AWS::ApiGatewayV2::Api'in rt:net.append('API Gateway')
                  if'AWS::CloudFront::Distribution'in rt:net.append('CloudFront')
                  db=[];
                  if'AWS::DynamoDB::Table'in rt:db.append('DynamoDB')
                  if'AWS::RDS::DBInstance'in rt:db.append('RDS')
                  st=[];
                  if'AWS::S3::Bucket'in rt:st.append('S3')
                  title=proto.get('title',stack_name);desc=proto.get('description',stack.get('Description','LEAP application'))
                  zb=io.BytesIO()
                  with zipfile.ZipFile(zb,'w',zipfile.ZIP_DEFLATED)as zf:
                      zf.writestr('.kiro/steering/product.md',f'---\ntitle: {title}\ninclusion: always\n---\n\n# Product Overview\n\n## Description\n{desc}\n\n## Stack: `{stack_name}` ({region})\n- Architecture: **{arch.upper()}**\n- AI/ML: {", ".join(ai) or "None"}\n- Networking: {", ".join(net) or "Direct"}\n- Database: {", ".join(db) or "None"}\n- Storage: {", ".join(st) or "None"}\n\n## Endpoints\n'+'\n'.join(f'- **{k}**: `{v}`'for k,v in outputs.items()if any(t in k.lower()for t in['url','endpoint','domain'])))
                      zf.writestr('.kiro/steering/tech.md',f'---\ntitle: Technology Stack\ninclusion: always\n---\n\n# Technology Stack\n\n## Architecture: {arch.upper()}\n\n## AWS Services\n- Compute: {arch.upper()}\n- Networking: {", ".join(net) or "N/A"}\n- Database: {", ".join(db) or "N/A"}\n- Storage: {", ".join(st) or "N/A"}\n- AI/ML: {", ".join(ai) or "N/A"}\n\n## Region: `{region}`\n\n## Resources: {len(resources)} total')
                      zf.writestr('.kiro/steering/aws-context.md',f'---\ntitle: AWS Context\ninclusion: always\n---\n\n# AWS Context\n\n## Stack\n- Name: `{stack_name}`\n- Region: `{region}`\n- Status: `{stack.get("StackStatus","Unknown")}`\n\n## Outputs\n| Key | Value |\n|-----|-------|\n'+'\n'.join(f'| `{k}` | `{v[:60]}{"..." if len(v)>60 else ""}` |'for k,v in outputs.items())+f'\n\n## Resources ({len(resources)} total)\n'+'\n'.join(f'- `{r["LogicalResourceId"]}` ({r["ResourceType"]})'for r in resources[:25])+('\n- ... and more'if len(resources)>25 else'')+f'\n\n## Deploy Command\n```bash\naws cloudformation update-stack --stack-name {stack_name} --template-body file://infrastructure/template.yaml --capabilities CAPABILITY_IAM CAPABILITY_NAMED_IAM --region {region}\n```')
                      zf.writestr('.kiro/settings/mcp.json',json.dumps({"mcpServers":{"aws-knowledge":{"url":"https://knowledge-mcp.global.api.aws","type":"http","disabled":False},"awslabs.aws-iac-mcp-server":{"command":"uvx","args":["awslabs.aws-iac-mcp-server@latest"],"env":{"FASTMCP_LOG_LEVEL":"ERROR"},"disabled":False}}},indent=2))
                      zf.writestr('.kiro/specs/modify-stack/requirements.md',f'# {title} - Requirements\n\n## Current State\nDeployed as `{stack_name}` in `{region}`\n\n---\n\n## Requirements\n\n### Requirement 1: [Feature Name]\n**User Story:** As a user, I want [X], so that [Y].\n\n#### Acceptance Criteria\n1. WHEN [condition] THE SYSTEM SHALL [behavior]\n2. WHEN [condition] THE SYSTEM SHALL [behavior]\n')
                      zf.writestr('.kiro/specs/modify-stack/design.md',f'# {title} - Design\n\n## Architecture: {arch.upper()}\n\n```\nClient -> {"CloudFront -> " if "CloudFront" in net else ""}{"API Gateway -> " if "API Gateway" in net else ""}{arch.upper()} -> {", ".join(ai+db) or "Backend"}\n```\n\n## Components\n'+'\n'.join(f'- **{r["LogicalResourceId"]}**: `{r["ResourceType"]}`'for r in resources if r["ResourceType"]in["AWS::Lambda::Function","AWS::EC2::Instance","AWS::ECS::Service","AWS::DynamoDB::Table","AWS::S3::Bucket"]))
                      zf.writestr('.kiro/specs/modify-stack/tasks.md','# Implementation Tasks\n\n## Setup\n- [ ] Review architecture in design.md\n- [ ] Run `./scripts/get-code.sh` to retrieve deployed code\n\n## Implementation\n- [ ] Implement changes\n- [ ] Test locally\n\n## Deployment\n- [ ] Deploy with `./scripts/deploy.sh`\n- [ ] Verify in AWS Console\n')
                      zf.writestr('infrastructure/template.yaml',tpl)
                      zf.writestr('scripts/deploy.sh',f'#!/bin/bash\nset -e\necho "Deploying {stack_name}..."\naws cloudformation update-stack --stack-name {stack_name} --template-body file://infrastructure/template.yaml --capabilities CAPABILITY_IAM CAPABILITY_NAMED_IAM --region {region} 2>&1 || echo "No updates needed"\necho "Waiting for completion..."\naws cloudformation wait stack-update-complete --stack-name {stack_name} --region {region} 2>&1 || true\necho "Done! Check outputs:"\naws cloudformation describe-stacks --stack-name {stack_name} --region {region} --query "Stacks[0].Outputs" --output table')
                      zf.writestr('scripts/get-code.sh',f'#!/bin/bash\necho "Stack: {stack_name}"\necho "Architecture: {arch}"\necho ""\n'+('echo "This is a SERVERLESS stack with Lambda functions."\necho "Lambda code is often inline in the CloudFormation template."\necho "Check infrastructure/template.yaml for the function code."\necho ""\necho "To download Lambda deployment packages:"\nfor fn in '+' '.join([r["PhysicalResourceId"] for r in resources if r["ResourceType"]=="AWS::Lambda::Function"][:3])+'; do\n  echo "Downloading $fn..."\n  aws lambda get-function --function-name $fn --query Code.Location --output text 2>/dev/null | xargs curl -s -o "src/lambda/$fn.zip" || echo "  (inline code - check template)"\ndone' if arch=='serverless' else 'echo "This is an EC2-based stack."\necho "Connect via SSM Session Manager:"\necho "  aws ssm start-session --target <instance-id> --region '+region+'"\necho ""\necho "Common code locations on EC2:"\necho "  /home/ec2-user/app/"\necho "  /var/app/"\necho "  /opt/app/"'))
                      zf.writestr('README.md',f'# {title}\n\nExported from **LEAP Stacks** for use with **Kiro IDE**.\n\n## Quick Start\n\n1. **Open in Kiro IDE** - Download from [kiro.dev](https://kiro.dev)\n2. **Retrieve Code** - Run `./scripts/get-code.sh`\n3. **Make Changes** - Edit files, use Kiro specs for guidance\n4. **Deploy** - Run `./scripts/deploy.sh`\n\n## Stack Info\n\n| Property | Value |\n|----------|-------|\n| Stack Name | `{stack_name}` |\n| Region | `{region}` |\n| Architecture | {arch.upper()} |\n| Resources | {len(resources)} |\n\n## Endpoints\n\n'+'\n'.join(f'- **{k}**: [{v[:50]}...]({v})'for k,v in outputs.items()if'url'in k.lower()or'endpoint'in k.lower())+f'\n\n## Project Structure\n\n```\n├── .kiro/              # Kiro IDE configuration\n│   ├── steering/       # Project context files\n│   ├── settings/       # MCP server config\n│   └── specs/          # Feature specifications\n├── infrastructure/     # CloudFormation template\n├── scripts/            # Deploy & code retrieval\n└── README.md\n```\n\n## MCP Servers\n\nPre-configured in `.kiro/settings/mcp.json`:\n- **AWS Knowledge** - AWS documentation & best practices\n- **AWS IaC** - CloudFormation validation\n\n---\n*Generated by LEAP Stacks on {datetime.now().strftime("%Y-%m-%d %H:%M")}*')
                      if arch=='serverless':zf.writestr('src/lambda/handler.py','# Lambda Handler Placeholder\n# The actual code is likely inline in infrastructure/template.yaml\n# Run ./scripts/get-code.sh to attempt downloading deployment packages\n\nimport json\n\ndef lambda_handler(event, context):\n    return {\n        "statusCode": 200,\n        "body": json.dumps({"message": "Hello from Lambda"})\n    }')
                      elif arch=='ec2':zf.writestr('src/app/main.py','# EC2 Application Placeholder\n# Connect to EC2 to retrieve actual code\n# Run ./scripts/get-code.sh for instructions\n\nfrom fastapi import FastAPI\napp = FastAPI()\n\n@app.get("/")\ndef root():\n    return {"status": "ok"}')
                  zb.seek(0);data=base64.b64encode(zb.read()).decode('utf-8')
                  return{'statusCode':200,'headers':{**headers,'Content-Type':'application/json'},'body':json.dumps({'message':'Success','filename':f'kiro-{stack_name}.zip','data':data})}
              except Exception as e:
                  import traceback;print(traceback.format_exc())
                  return{'statusCode':500,'headers':headers,'body':json.dumps({'error':str(e)})}

  GenerateKiroProjectResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref ApiGatewayRestApi
      ParentId: !GetAtt ApiGatewayRestApi.RootResourceId
      PathPart: generate-kiro-project

  GenerateKiroProjectMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref ApiGatewayRestApi
      ResourceId: !Ref GenerateKiroProjectResource
      HttpMethod: POST
      AuthorizationType: NONE
      Integration:
