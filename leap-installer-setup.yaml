                /**
                * Attaches the click listener to toggle group visibility
                */
                function initCategoryToggles() {
                    $('.category-header').off('click').on('click', function () {
                        $(this).parent('.category-group').toggleClass('collapsed');
                    });
                }

           
            function GetServiceIcon(name) {
                if (!fulldata || !fulldata['files']) return "";
                
                for (var i=0;i<fulldata['files'].length;i++) {
                    if (fulldata['files'][i]['name']==name) return fulldata['files'][i]['public_url'];
                }

                // If not found, check explainers for alias
                if (appinfo && appinfo['explainers']) {
                    for (var j=0; j<appinfo['explainers'].length; j++) {
                        var explainer = appinfo['explainers'][j];
                        
                        
                        if (explainer.term_alt) {
                            var alt = explainer.term_alt.toLowerCase().replace(/ /g, '');
                            if (alt == name) {
                                // If matched, try to find the icon using the primary term (normalized)
                                var primaryTerm = explainer.term.toLowerCase().replace(/ /g, '');
                                for (var k=0; k<fulldata['files'].length; k++) {
                                    if (fulldata['files'][k]['name'] == primaryTerm) {
                                        return fulldata['files'][k]['public_url'];
                                    }
                                }
                            }
                        }
                    }
                }
                
                return "";
            }

            
            function showVariableInputModal(id, variables) {
