            function getRandomFloat(min, max) { return Math.random() * (max - min) + min; }     
            function setCookie(name, value, days) { const expires = new Date(); expires.setTime(expires.getTime() + (days * 24 * 60 * 60 * 1000)); document.cookie = name + '=' + value + ';expires=' + expires.toUTCString() + ';path=/'; }
            function getCookie(name) { const nameEQ = name + '='; const ca = document.cookie.split(';'); for(let i = 0; i < ca.length; i++) { let c = ca[i]; while (c.charAt(0) == ' ') c = c.substring(1, c.length); if (c.indexOf(nameEQ) == 0) return c.substring(nameEQ.length, c.length); } return null; }
            function isDataStale() { const dt = getCookie('leap_data_timestamp'); if (!dt) return true; return ((new Date() - new Date(parseInt(dt))) / (1000 * 60 * 60 * 24)) > 6; }
            function hasActivePrototypes() { if (!prototypes || prototypes.length === 0) return false; return prototypes.some(p => p.active === true); }
            const saveToLocalStorage = (key, val) => { try { localStorage.setItem(key, JSON.stringify(val)); return true; } catch (e) { return false; } };
            const loadFromLocalStorage = (key) => { try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : null; } catch (e) { return null; } };

            function renderDeveloperResources(prototypeId, prototypeIndex) {
            const prototype = prototypes[prototypeIndex];
            const outputs = prototype.outputs || {};
            const devResources = prototype.developerResources || [];
            
            // If no developer resources defined, hide the section
            if (!devResources.length) {
                return;
            }
            
            const container = $('.prototype-card[data-id="' + prototypeId + '"] .dev-resources-grid');
            container.empty();
            
            // Get current AWS region for console links
            const awsRegion = 'us-east-1'; // Or extract from outputs if available
            
            devResources.forEach(function(resource, idx) {
                const outputValue = outputs[resource.outputKey] || '';
                
                if (!outputValue) {
                    return; // Skip if no value
                }
                
                let resourceHtml = '';
                
                if (resource.type === 'code') {
                    // Render code block with syntax highlighting style
                    resourceHtml = 
                        '<div class="dev-resource-item">' +
                            '<div class="dev-resource-header">' +
                                '<span class="dev-resource-label">' +
                                    resource.label +
                                    '<span class="dev-resource-type-badge code">' + (resource.language || 'code') + '</span>' +
                                '</span>' +
                            '</div>' +
                            '<p class="dev-resource-description">' + resource.description + '</p>' +
                            '<div class="dev-resource-code-block">' +
                                '<button class="dev-resource-code-copy" data-copy-value="' + encodeURIComponent(outputValue) + '">Copy</button>' +
                                '<pre><code>' + escapeHtml(outputValue) + '</code></pre>' +
                            '</div>' +
                        '</div>';
                } else {
                    // Render URL or text resource
                    let displayValue = outputValue;
                    let valueHtml = '';
                    
                    if (resource.type === 'url') {
                        valueHtml = '<a href="' + outputValue + '" target="_blank">' + truncateText(outputValue, 60) + '</a>';
                    } else {
                        valueHtml = '<span>' + truncateText(outputValue, 60) + '</span>';
                    }
                    
                    // Build console link if provided
                    let consoleLinkHtml = '';
                    if (resource.consoleUrl) {
                        const consoleUrl = resource.consoleUrl
                            .replace('{{region}}', awsRegion)
                            .replace('{{value}}', encodeURIComponent(outputValue));
                        consoleLinkHtml = 
                            '<a href="' + consoleUrl + '" target="_blank" class="dev-resource-console-link">' +
                                '☁️ Open in AWS Console' +
                            '</a>';
                    }
                    
                    resourceHtml = 
                        '<div class="dev-resource-item">' +
                            '<div class="dev-resource-header">' +
                                '<span class="dev-resource-label">' +
                                    resource.label +
                                    '<span class="dev-resource-type-badge ' + resource.type + '">' + resource.type + '</span>' +
                                '</span>' +
                            '</div>' +
                            '<p class="dev-resource-description">' + resource.description + '</p>' +
                            '<div class="dev-resource-value-container">' +
                                '<span class="dev-resource-value">' + valueHtml + '</span>' +
                                '<button class="dev-resource-copy-btn" data-copy-value="' + encodeURIComponent(outputValue) + '">' +
                                    '📋 Copy' +
                                '</button>' +
                            '</div>' +
                            consoleLinkHtml +
                        '</div>';
                }
                
                container.append(resourceHtml);
            });
            
            // Show the container if we rendered any resources
            if (container.children().length > 0) {
                $('.prototype-card[data-id="' + prototypeId + '"] .dev-resources-container').fadeIn();
            }
        }

        // Helper function to escape HTML entities
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Helper function to truncate text with ellipsis
        function truncateText(text, maxLength) {
            if (text.length <= maxLength) return text;
            return text.substring(0, maxLength) + '...';
        }

