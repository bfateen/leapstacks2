            // ==========================================
            // URL AUTO-REFRESH SYSTEM
            // ==========================================
            
            const URL_REFRESH_CONFIG = {
                apiEndpoint: 'https://${ApiGatewayRestApi}.execute-api.${AWS::Region}.amazonaws.com/prod/regenerate-urls',
                refreshBeforeExpiry: 1,
                urlLifetime: 7,
                checkInterval: 60 * 60 * 1000
            };

            async function refreshStackUrls(stackNames) {
                try {
                    const response = await fetch(URL_REFRESH_CONFIG.apiEndpoint, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ type: 'stacks', stacks: stackNames })
                    });
                    
                    if (!response.ok) throw new Error('HTTP error! status: ' + response.status);
                    const data = await response.json();
                    return data.stacks;
                } catch (error) {
                    console.error('Error refreshing stack URLs:', error);
                    throw error;
                }
            }

            function updatePrototypeWithRefreshedUrl(stackName, stackData) {
                const prototypeIndex = prototypes.findIndex(p => p.stackname === stackName);
                
                if (prototypeIndex !== -1) {
                    prototypes[prototypeIndex].frontend = stackData.frontend_url;
                    if (stackData.backend_url) prototypes[prototypeIndex].backend = stackData.backend_url;
                    if (stackData.custom_outputs) {
                        prototypes[prototypeIndex].outputs = {
                            ...prototypes[prototypeIndex].outputs,
                            ...stackData.custom_outputs
                        };
                    }
                    prototypes[prototypeIndex].lastUrlRefresh = Date.now();
                    
                    const card = $('.prototype-card[data-stackname="' + stackName + '"]');
                    if (card.length) {
                    
                        const deploymentLinks = card.find('.deployment-links');

                        const frontendLink = card.find('.deployment-links a[href*="index.html"]');
                        if (frontendLink.length) frontendLink.attr('href', stackData.frontend_url);

                        // Update any input fields
                        const frontendInput = deploymentLinks.find('input[value*="s3.amazonaws.com"]');
                        if (frontendInput.length) {
                            frontendInput.val(stackData.frontend_url);
                        }
                        
                        const indicator = $('<span class="url-refreshed-indicator" style="color:#28a745;margin-left:10px;">✓ Link refreshed</span>');
                        card.find('.deployment-status').append(indicator);
                        setTimeout(() => indicator.fadeOut(() => indicator.remove()), 3000);
                    }
                    
                    fulldata.prototypes = prototypes;
                    saveToLocalStorage('myAppState', fulldata);
                    console.log('Updated URLs for ' + stackName);
                }
            }

            function needsUrlRefresh(lastRefresh) {
                if (!lastRefresh) return true;
                const daysSinceRefresh = (Date.now() - lastRefresh) / (1000 * 60 * 60 * 24);
                const daysUntilExpiry = URL_REFRESH_CONFIG.urlLifetime - daysSinceRefresh;
                return daysUntilExpiry <= URL_REFRESH_CONFIG.refreshBeforeExpiry;
            }

            async function refreshAllActiveStackUrls() {
                const stacksToRefresh = prototypes
                    .filter(p => p.active && p.stackname && needsUrlRefresh(p.lastUrlRefresh))
                    .map(p => p.stackname);
                
                if (stacksToRefresh.length === 0) {
                    console.log('No URLs need refreshing');
                    return;
                }
                
                console.log('Refreshing URLs for ' + stacksToRefresh.length + ' stack(s)...');
                
                try {
                    const results = await refreshStackUrls(stacksToRefresh);
                    let successCount = 0;
                    
                    for (const stackName in results) {
                        const stackData = results[stackName];
                        if (stackData.status === 'SUCCESS') {
                            updatePrototypeWithRefreshedUrl(stackName, stackData);
                            successCount++;
                        } else {
                            console.error('Failed to refresh ' + stackName + ':', stackData.error);
                        }
                    }
                    
                    console.log('URL refresh complete: ' + successCount + ' succeeded');
                    if (successCount > 0) showGlobalNotification('Refreshed ' + successCount + ' link(s)', 'success');
                } catch (error) {
                    console.error('Failed to refresh URLs:', error);
                    showGlobalNotification('Failed to refresh links', 'error');
                }
            }

            function showGlobalNotification(message, type) {
                const bgColor = type === 'success' ? '#28a745' : '#dc3545';
                const notification = $('<div style="position:fixed;top:20px;right:20px;background:' + bgColor + ';color:white;padding:15px 20px;border-radius:8px;box-shadow:0 4px 8px rgba(0,0,0,0.2);z-index:10000;animation:slideIn 0.3s ease-out;">' + message + '</div>');
                $('body').append(notification);
                setTimeout(() => notification.fadeOut(() => notification.remove()), 3000);
            }

            // ============================================================================
            // KIRO PROJECT DOWNLOAD FUNCTION
            // ============================================================================
            async function downloadKiroProject(prototypeData) {
                if (!prototypeData || !prototypeData.stackname) {
                    showGlobalNotification('Stack not deployed yet. Please launch first.', 'error');
                    return;
                }
                
                showGlobalNotification('Generating Kiro project...', 'success');
                
                try {
                    const response = await fetch(
                        'https://${ApiGatewayRestApi}.execute-api.${AWS::Region}.amazonaws.com/prod/generate-kiro-project',
                        {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                stackName: prototypeData.stackname,
                                prototypeInfo: {
                                    title: prototypeData.title,
                                    description: prototypeData.description || prototypeData.fulldescription,
                                    id: prototypeData.id
                                }
                            })
                        }
                    );
                    
                    const data = await response.json();
                    
                    if (data.error) {
                        throw new Error(data.error);
                    }
                    
                    if (data.data) {
                        // Convert base64 to blob
                        const byteCharacters = atob(data.data);
                        const byteNumbers = new Array(byteCharacters.length);
                        for (let i = 0; i < byteCharacters.length; i++) {
                            byteNumbers[i] = byteCharacters.charCodeAt(i);
                        }
                        const byteArray = new Uint8Array(byteNumbers);
                        const blob = new Blob([byteArray], { type: 'application/zip' });
                        
                        // Trigger download
                        const url = window.URL.createObjectURL(blob);
                        const a = document.createElement('a');
                        a.href = url;
                        a.download = data.filename || 'kiro-project.zip';
                        document.body.appendChild(a);
                        a.click();
                        document.body.removeChild(a);
                        window.URL.revokeObjectURL(url);
                        
                        showGlobalNotification('Kiro project downloaded! Open the folder in Kiro IDE.', 'success');
                    }
                } catch (error) {
                    console.error('Error generating Kiro project:', error);
                    showGlobalNotification('Failed to generate Kiro project: ' + error.message, 'error');
                }
            }

            $(document).on('click', '.manual-refresh-url-btn', async function(e) {
              e.preventDefault();
              const button = $(this);
              const stackName = button.data('stackname');
              const originalText = button.html();
              const originalBg = button.css('background');  // Store original background
              
              // Show loading state
              button.prop('disabled', true)
                    .html('<span style="display:inline-block;animation:spin 1s linear infinite;">⟳</span> Refreshing...')
                    .css('opacity', '0.6');
              
              try {
                  const results = await refreshStackUrls([stackName]);
                  const stackData = results[stackName];
                  
                  if (stackData.status === 'SUCCESS') {
                      updatePrototypeWithRefreshedUrl(stackName, stackData);
                      // Don't change button appearance, just re-enable it
                  } else {
                      throw new Error(stackData.error);
                  }
              } catch (error) {
                  console.error('Failed to refresh URL:', error);
