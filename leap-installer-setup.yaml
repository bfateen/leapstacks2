            function hideModal() { if (hasaccess) document.getElementById('overlay').style.display = 'none'; }
            
         
            function deployPrototype(id) {
               
                var currentProto = prototypes.find(p => p.id == id);
                var requiredmodels = currentProto['requiredModels']; 
                if (requiredmodels && (requiredmodels.length > 0)) {
                    var reqmodstring = requiredmodels.join(',');
                    var reqsfound = false;
                    for (var i = 0; i < requiredmodels.length; i++) {
                        reqsfound = false;
                        fulldata["models_access"].forEach(function(model) {
                            if ((model.enabled) && (requiredmodels[i] == model.id)) reqsfound = true;
                        });
                        if (!reqsfound) {
                            alert('This prototype requires: ' + reqmodstring);
                            
                            $('#editmodels').trigger('click');
                            return;
                        }
                    }
                }
                if ($(".prototype-card[data-id='" + id + "']").find('.modelsel').val() && $(".prototype-card[data-id='" + id + "']").find('.modelsel').val().includes('embed')) {
                    alert('You cannot choose a text embedding model as the main LLM');
                    return;
                }
                if (currentProto.requiredVariables && currentProto.requiredVariables.length > 0) {
                    showVariableInputModal(id, currentProto.requiredVariables);
                    return; 
                }
                 $('.prototype-card[data-id="' + id + '"]').find('.status-msg').html('Loading...');
                triggerLaunchProcess(id);
            }

            function triggerLaunchProcess(id, customReplacements) {
                const card = $(".prototype-card[data-id='" + id + "']");
                const cardContent = card.find('.card-content');
                const progressBar = card.find('.progress-bar');
                const progressFill = card.find('.progress-fill');
                const deploymentInfo = card.find('.deployment-info');
                const statusMsg = card.find('.status-msg');

                // Show status message
                statusMsg.html('Initializing deployment...');

                // Hide launch content
                cardContent.fadeOut();

                // Make sure deployment info stays hidden
                deploymentInfo.hide();

                // Add expanded class for full-width
                card.addClass('expanded');

                // Show progress bar and reset fill
                progressBar.show();
                progressFill.css('width', '0%');

                // Get estimated time from prototype data
                var pindex = 0;
                for (var i = 0; i < prototypes.length; i++) {
                    if (prototypes[i]['id'] == id) {
                        pindex = i;
                        break;
                    }
                }

                let totsecs = prototypes[pindex]['estimatedSetupTime'] || 120;
                let tick = 29 / totsecs;

                // Simulate progress
                let progress = 0;
                const interval = setInterval(() => {
                    if (progress < 85) {
                        progress += Math.random() * tick * 2 + tick;
                    } else {
                        progress += tick;
                    }

                    if (progress >= 100) {
                        progress = 100;
                        clearInterval(interval);
                    }

                    progressFill.css('width', progress + '%');
                }, 500);

                // Store interval ID on card for cleanup if needed
                card.data('progressInterval', interval);

                // Start the actual deployment WITH customReplacements
                deployPrototypeTemplate(id, customReplacements);
            }
            
            // Placeholder for remaining functions to ensure valid script
            async function deployPrototypeTemplate(id, customReplacements) {
                 // Standard deployment logic...
                 if(!customReplacements) customReplacements = [];
                 const output = document.getElementById('output');
                 
                 var pindexEarly = prototypes.findIndex(p => p.id == id);
                    if (pindexEarly >= 0) {
                        prototypes[pindexEarly]['launching'] = true;
                        prototypes[pindexEarly]['launchStartTime'] = Date.now();
                        fulldata['prototypes'] = prototypes;
                        saveToLocalStorage('myAppState', fulldata);
                    }

                 const apiUrl = 'https://${ApiGatewayRestApi}.execute-api.${AWS::Region}.amazonaws.com/prod/initiate'; 
                 const tkey = 'protoscripts/' + id + '/template.yaml';
                 
                 
                 var replacements = [];
                 replacements = replacements.concat(customReplacements);
                 var mid= $(".prototype-card[data-id='" + id + "']").find('.modelsel').val();
