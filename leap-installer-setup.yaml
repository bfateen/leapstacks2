AWSTemplateFormatVersion: '2010-09-09'
Description: 'LEAP Stacks installer v2.1.1 by Basil Fateen'

Parameters:
  AdminEmail:
    Type: String
    Description: (REQUIRED) Email address for the admin user
    Default: admin@example.com

  StackCode:
    Type: String
    Description: UniqueID
    Default: leapv2
  
  InitialPassword:
    Type: String
    Description: (REQUIRED) Set password for the admin user (8+ chars, uppercase & lowercase letters, numbers, special chars)
    MinLength: 8
    NoEcho: true
    AllowedPattern: "^(?=.*[a-z])(?=.*[A-Z])(?=.*\\d)(?=.*[!@#$%^&*])[a-zA-Z\\d!@#$%^&*]{8,}$"
  

Resources:
  # S3 Bucket
  WebsiteBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
        
  #SECURED s3
  # S3 Bucket Cleanup Function
  WebsiteCleanupRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: S3CleanupPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:ListBucket
                  - s3:DeleteObject
                  - s3:DeleteObjectVersion
                  - s3:GetObjectVersion
                  - s3:ListBucketVersions
                Resource: 
                  - !Sub 'arn:aws:s3:::${WebsiteBucket}'
                  - !Sub 'arn:aws:s3:::${WebsiteBucket}/*'

  WebsiteCleanupFunction:
    Type: AWS::Lambda::Function
    Properties:
      Handler: index.handler
      Role: !GetAtt WebsiteCleanupRole.Arn
      Code:
        ZipFile: |
          import boto3
          import cfnresponse
          import logging
          import time

          logger = logging.getLogger()
          logger.setLevel(logging.INFO)

          def delete_bucket_contents(bucket_name):
              try:
                  logger.info(f"Starting cleanup of bucket: {bucket_name}")
                  s3 = boto3.client('s3')
                  
                  # Delete all object versions
                  paginator = s3.get_paginator('list_object_versions')
                  pages = paginator.paginate(Bucket=bucket_name)
                  
                  delete_list = []
                  
                  try:
                      for page in pages:
                          # Handle versions
                          if 'Versions' in page:
                              for version in page['Versions']:
                                  delete_list.append({
                                      'Key': version['Key'],
                                      'VersionId': version['VersionId']
                                  })
                          
                          # Handle delete markers
                          if 'DeleteMarkers' in page:
                              for marker in page['DeleteMarkers']:
                                  delete_list.append({
                                      'Key': marker['Key'],
                                      'VersionId': marker['VersionId']
                                  })
                          
                          if delete_list:
                              logger.info(f"Deleting {len(delete_list)} objects")
                              s3.delete_objects(
                                  Bucket=bucket_name,
                                  Delete={'Objects': delete_list}
                              )
                              delete_list = []
                      
                      # Final check for non-versioned objects
                      paginator = s3.get_paginator('list_objects_v2')
                      pages = paginator.paginate(Bucket=bucket_name)
                      
                      for page in pages:
                          if 'Contents' in page:
                              objects = [{'Key': obj['Key']} for obj in page['Contents']]
                              if objects:
                                  logger.info(f"Deleting {len(objects)} non-versioned objects")
                                  s3.delete_objects(
                                      Bucket=bucket_name,
                                      Delete={'Objects': objects}
                                  )
                      
                      logger.info(f"Successfully cleaned up bucket: {bucket_name}")
                      return True
                      
                  except Exception as e:
                      logger.error(f"Error during deletion: {str(e)}")
                      return False
                      
              except Exception as e:
                  logger.error(f"Error accessing bucket: {str(e)}")
                  return False

          def handler(event, context):
              logger.info('Received event: %s', event)
              response_data = {}
              
              try:
                  bucket_name = event['ResourceProperties']['BucketName']
                  
                  if event['RequestType'] == 'Delete':
                      # Attempt cleanup multiple times
                      max_attempts = 3
                      for attempt in range(max_attempts):
                          logger.info(f"Cleanup attempt {attempt + 1} of {max_attempts}")
                          if delete_bucket_contents(bucket_name):
                              break
                          if attempt < max_attempts - 1:
                              time.sleep(5)  # Wait before retry
                  
                  cfnresponse.send(event, context, cfnresponse.SUCCESS, response_data)
                  
              except Exception as e:
                  logger.error(f"Error in handler: {str(e)}")
                  cfnresponse.send(event, context, cfnresponse.FAILED, response_data)

      Runtime: python3.11
      Timeout: 300  # Increased timeout to 5 minutes
      MemorySize: 256  # Increased memory

  BucketCleanupResource:
    Type: Custom::S3Cleanup
    DependsOn: WebsiteBucket
    Properties:
      ServiceToken: !GetAtt WebsiteCleanupFunction.Arn
      BucketName: !Ref WebsiteBucket
      


  # Cognito User Pool with Hosted UI
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub ${StackCode}-users
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: true
      AutoVerifiedAttributes:
        - email
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: true
          RequireUppercase: true
      UsernameAttributes:
        - email

  UserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      Domain: !Sub ${StackCode}-${AWS::Region}-${AWS::AccountId}-auth
      UserPoolId: !Ref UserPool

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref UserPool
      ClientName: !Sub ${StackCode}-client
      GenerateSecret: false
      CallbackURLs: 
        - !Sub https://${Api}.execute-api.${AWS::Region}.amazonaws.com/prod/callback
      LogoutURLs:
        - !Sub https://${Api}.execute-api.${AWS::Region}.amazonaws.com/prod/signout
      AllowedOAuthFlows:
        - code
      AllowedOAuthScopes:
        - email
        - openid
        - profile
      AllowedOAuthFlowsUserPoolClient: true
      SupportedIdentityProviders:
        - COGNITO
      

  # Lambda for URL signing and callback handling
  LambdaExecutionRole:
    Type: 'AWS::IAM::Role'
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: LambdaExecutionPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - bedrock:CreateInferenceProfile
                  - bedrock:GetInferenceProfile
                  - bedrock:ListInferenceProfiles
                  - bedrock:DeleteInferenceProfile
                  - bedrock:TagResource
                  - bedrock:UntagResource
                  - bedrock:ListTagsForResource
                Resource:
                  - 'arn:aws:bedrock:*:*:inference-profile/*'
                  - 'arn:aws:bedrock:*:*:application-inference-profile/*'
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                  - logs:DeleteLogGroup
                  - logs:DeleteLogStream
                Resource: 'arn:aws:logs:*:*:*'
              - Effect: Allow
                Action:
                  - 's3:PutObject'
                  - 's3:GetObject'
                  - 's3:ListBucket'
                Resource: 
                  - !Sub 'arn:aws:s3:::${WebsiteBucket}'
                  - !Sub 'arn:aws:s3:::${WebsiteBucket}/*'
              - Effect: Allow
                Action:
                  - cloudformation:CreateStack
                  - cloudformation:DeleteStack
                  - cloudformation:DescribeStacks
                  - cloudformation:DescribeStackEvents
                  - cloudformation:TagResource
                  - cloudformation:CreateChangeSet
                Resource: '*'
              - Effect: Allow
                Action:
                  - iam:CreateRole
                  - iam:CreateServiceLinkedRole
                  - iam:PutRolePolicy
                  - iam:AttachRolePolicy
                  - iam:DetachRolePolicy
                  - iam:DeleteRole
                  - iam:DeleteRolePolicy
                  - iam:GetRole
                  - iam:TagRole
                  - iam:CreateUser
                  - iam:DeleteUser
                  - iam:GetUser
                  - iam:ListUsers
                  - iam:UpdateUser
                  - iam:TagUser
                  - iam:UntagUser
                  - iam:CreateLoginProfile
                  - iam:DeleteLoginProfile
                  - iam:GetLoginProfile
                  - iam:UpdateLoginProfile
                  - iam:CreateAccessKey
                  - iam:DeleteAccessKey
                  - iam:ListAccessKeys
                  - iam:AttachUserPolicy
                  - iam:DetachUserPolicy
                  - iam:ListAttachedUserPolicies
                  - iam:PutUserPolicy
                  - iam:DeleteUserPolicy
                  - iam:ListUserPolicies
                  - iam:PassRole     
                  - iam:GetUserPolicy    
                Resource: '*'
              - Effect: Allow
                Action:
                  - tag:GetResources
                  - tag:TagResources
                  - tag:UntagResources
                  - cognito-idp:AdminGetUser
                  - cognito-idp:AdminUpdateUserAttributes
                  - cognito-idp:ListUsers
                  - cognito-idp:DescribeUserPoolClient
                Resource: '*'
              - Effect: Allow
                Action:
                  - servicecatalog:CreateApplication
                  - servicecatalog:GetApplication
                  - servicecatalog:AssociateResource
                  - servicecatalog:DisassociateResource
                  - servicecatalog:TagResource
                Resource: '*'
              - Effect: Allow
                Action:
                  - 's3:*'
                  - 'ApiGateway:*'
                  - 'bedrock:*'
                  - 'lambda:*'
                  - 'secretsmanager:*'
                  - 'aoss:*'
                  - 'cognito-idp:*'
                  - 'states:CreateStateMachine'
                  - 'states:StartExecution'
                  - 'states:StopExecution'
                  - 'dynamodb:*'
                  - 'ec2:*'
                  - 'elasticfilesystem:*'
                  - 'dynamodb:*'
                  - 'codebuild:*'
                  - 'events:*'
                  - 'ecr:*'
                  - 'bedrock-agentcore:*'
                  - 'cloudformation:*'
                  - 'iam:*'
                  - 'rds:*'
                  - 'rds-data:*'
                  - 'ssm:*'
                  - 'amplify:*'
                  - 'cloudfront:*'
                  - 'aws-marketplace:*'
                Resource: '*'

              # EC2 VPC and Networking permissions
              - Effect: Allow
                Action:
                  - 'ec2:CreateVpc'
                  - 'ec2:CreateSubnet'
                  - 'ec2:CreateInternetGateway'
                  - 'ec2:CreateRouteTable'
                  - 'ec2:CreateRoute'
                  - 'ec2:CreateSecurityGroup'
                  - 'ec2:CreateTags'
                  - 'ec2:AuthorizeSecurityGroupIngress'
                  - 'ec2:AuthorizeSecurityGroupEgress'
                  - 'ec2:AttachInternetGateway'
                  - 'ec2:AssociateRouteTable'
                  - 'ec2:ModifyVpcAttribute'
                  - 'ec2:ModifySubnetAttribute'
                  - 'ec2:DescribeVpcs'
                  - 'ec2:DescribeSubnets'
                  - 'ec2:DescribeSecurityGroups'
                  - 'ec2:DescribeInternetGateways'
                  - 'ec2:DescribeRouteTables'
                  - 'ec2:DescribeAvailabilityZones'
                  - 'ec2:DescribeNetworkInterfaces'
                  - 'ec2:DescribeVpcAttribute'
                Resource: '*'
              
              # EFS permissions
              - Effect: Allow
                Action:
                  - 'elasticfilesystem:CreateFileSystem'
                  - 'elasticfilesystem:CreateMountTarget'
                  - 'elasticfilesystem:CreateAccessPoint'
                  - 'elasticfilesystem:DescribeFileSystems'
                  - 'elasticfilesystem:DescribeMountTargets'
                  - 'elasticfilesystem:DescribeAccessPoints'
                  - 'elasticfilesystem:DescribeMountTargetSecurityGroups'
                  - 'elasticfilesystem:TagResource'
                  - 'elasticfilesystem:PutLifecycleConfiguration'
                  - 'elasticfilesystem:*'
                Resource: '*'
              
              # Elastic Load Balancing permissions
              - Effect: Allow
                Action:
                  - 'elasticloadbalancing:CreateLoadBalancer'
                  - 'elasticloadbalancing:CreateTargetGroup'
                  - 'elasticloadbalancing:CreateListener'
                  - 'elasticloadbalancing:DescribeLoadBalancers'
                  - 'elasticloadbalancing:DescribeTargetGroups'
                  - 'elasticloadbalancing:DescribeListeners'
                  - 'elasticloadbalancing:DescribeTargetHealth'
                  - 'elasticloadbalancing:DescribeLoadBalancerAttributes'
                  - 'elasticloadbalancing:DescribeTargetGroupAttributes'
                  - 'elasticloadbalancing:ModifyTargetGroupAttributes'
                  - 'elasticloadbalancing:ModifyLoadBalancerAttributes'
                  - 'elasticloadbalancing:SetSecurityGroups'
                  - 'elasticloadbalancing:SetSubnets'
                  - 'elasticloadbalancing:AddTags'
                  - 'elasticloadbalancing:*'
                Resource: '*'

              # ECS permissions
              - Effect: Allow
                Action:
                  - 'ecs:CreateCluster'
                  - 'ecs:CreateService'
                  - 'ecs:RegisterTaskDefinition'
                  - 'ecs:DeregisterTaskDefinition'
                  - 'ecs:DescribeClusters'
                  - 'ecs:DescribeServices'
                  - 'ecs:DescribeTaskDefinition'
                  - 'ecs:DescribeTasks'
                  - 'ecs:ListClusters'
                  - 'ecs:ListServices'
                  - 'ecs:ListTaskDefinitions'
                  - 'ecs:UpdateService'
                  - 'ecs:TagResource'
                  - 'ecs:*'
                Resource: '*'

              # CloudWatch Logs permissions
              - Effect: Allow
                Action:
                  - 'logs:CreateLogGroup'
                  - 'logs:CreateLogStream'
                  - 'logs:PutLogEvents'
                  - 'logs:DescribeLogGroups'
                  - 'logs:DescribeLogStreams'
                  - 'logs:PutRetentionPolicy'
                  - 'logs:TagResource'
                  - 'logs:TagLogGroup'
                Resource: '*'

  AuthHandlerFunction:
    Type: AWS::Lambda::Function
    Properties:
      Runtime: python3.11
      Handler: index.handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Timeout: 30
      Code:
        ZipFile: |
          import boto3
          import json
          import os
          import urllib.parse
          from botocore.config import Config
          
          def handler(event, context):
              path = event['path']
              
              if path == '/callback':
                  # Handle OAuth callback
                  code = event['queryStringParameters'].get('code')
                  if not code:
                      return {
                          'statusCode': 302,
                          'headers': {
                              'Location': f"https://{os.environ['COGNITO_DOMAIN']}/login"
                          }
                      }
                  
                  # Generate signed URL for protected content
                  region = os.environ.get('AWS_REGION', 'us-east-1')

                  s3 = boto3.client(
                      's3',
                      region_name=region,
                      config=Config(
                          signature_version='s3v4',
                          s3={'addressing_style': 'virtual'}
                      )
                  )

                  url = s3.generate_presigned_url(
                      'get_object',
                      Params={
                          'Bucket': os.environ['BUCKET_NAME'],
                          'Key': 'protected.html'
                      },
                      ExpiresIn=604800
                  )
                  
                  return {
                      'statusCode': 302,
                      'headers': {
                          'Location': url
                      }
                  }
              
              elif path == '/signout':
                  # Handle sign out
                  return {
                      'statusCode': 302,
                      'headers': {
                          'Location': f"https://{os.environ['COGNITO_DOMAIN']}/logout"
                      }
                  }
              
              # Default: redirect to Cognito login
              return {
                  'statusCode': 302,
                  'headers': {
                      'Location': f"https://{os.environ['COGNITO_DOMAIN']}/login?response_type=code&client_id={os.environ['CLIENT_ID']}&redirect_uri={urllib.parse.quote(os.environ['CALLBACK_URL'])}"
                  }
              }
      Environment:
        Variables:
          BUCKET_NAME: !Ref WebsiteBucket
          COGNITO_DOMAIN: !Sub ${StackCode}-${AWS::Region}-${AWS::AccountId}-auth.auth.${AWS::Region}.amazoncognito.com
          CLIENT_ID: !Ref UserPoolClient
          CALLBACK_URL: !Sub https://${Api}.execute-api.${AWS::Region}.amazonaws.com/prod/callback

  # API Gateway
  Api:
    Type: AWS::ApiGateway::RestApi
    Properties:
      Name: !Sub ${StackCode}-api
      EndpointConfiguration:
        Types:
          - REGIONAL

  # Add root method (for base URL)
  RootMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      AuthorizationType: NONE
      HttpMethod: ANY
      Integration:
        IntegrationHttpMethod: POST
        Type: AWS_PROXY
        Uri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${AuthHandlerFunction.Arn}/invocations
      ResourceId: !GetAtt Api.RootResourceId
      RestApiId: !Ref Api

  # Proxy resource for all other paths
  ProxyResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      ParentId: !GetAtt Api.RootResourceId
      PathPart: '{proxy+}'
      RestApiId: !Ref Api

  ProxyMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      AuthorizationType: NONE
      HttpMethod: ANY
      Integration:
        IntegrationHttpMethod: POST
        Type: AWS_PROXY
        Uri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${AuthHandlerFunction.Arn}/invocations
      ResourceId: !Ref ProxyResource
      RestApiId: !Ref Api

  ApiDeployment:
    Type: AWS::ApiGateway::Deployment
    DependsOn: 
      - RootMethod
      - ProxyMethod
      - UserPoolDomain        
      - UserPoolClient       
      - CreateCognitoUser     
      - WebAppFile
    Properties:
      RestApiId: !Ref Api

  ApiStage:
    Type: AWS::ApiGateway::Stage
    Properties:
      DeploymentId: !Ref ApiDeployment
      RestApiId: !Ref Api
      StageName: prod

  # Lambda permission
  LambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !GetAtt AuthHandlerFunction.Arn
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${Api}/*

  # Content uploader
  ContentUploaderRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: S3UploadAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: s3:PutObject
                Resource: !Sub ${WebsiteBucket.Arn}/*


  WebAppFile:
    Type: 'Custom::S3Object'
    DependsOn: GetGithubRepoApiDeployment
    Properties:
      ServiceToken: !GetAtt ContentUploader.Arn
      BucketName: !Ref WebsiteBucket
      Key: index.html
      Body: !Sub |
        <!DOCTYPE html>
        <html lang="en">
        <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>LEAP Stacks</title>
            <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
            <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
            <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
            <style>
                :root {
                    --bg-primary: #0f172a;
                    --bg-secondary: #1e293b;
                    --bg-tertiary: #334155;
                    --text-primary: #f8fafc;
                    --text-secondary: #94a3b8;
                    --accent-blue: #3b82f6;
                    --accent-blue-hover: #2563eb;
                    --accent-green: #22c55e;
                    --accent-red: #ef4444;
                    --border-color: #334155;
                    --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.3);
                    --font-family: 'Inter', system-ui, -apple-system, sans-serif;
                }

                * { margin: 0; padding: 0; box-sizing: border-box; }

                body {
                    font-family: var(--font-family);
                    background-color: var(--bg-primary) !important;
                    color: var(--text-primary);
                    line-height: 1.5;
                }

                /* Header */
                .top-nav {
                    background-color: var(--bg-primary);
                    padding: 20px 0;
                    border-bottom: 1px solid var(--border-color);
                    margin-bottom: 32px;
                }

                .nav-container {
                    max-width: 1600px;
                    margin: 0 auto;
                    display: flex;
                    justify-content: space-between;
                    align-items: center;
                    padding: 0 24px;
                }

                .logo {
                    font-size: 1.25rem;
                    font-weight: 700;
                    color: var(--text-primary);
                    text-decoration: none;
                    display: flex;
                    align-items: center;
                    gap: 10px;
                }
                
                .logo::before {
                    content: '\f5fd'; /* Layer group icon */
                    font-family: "Font Awesome 6 Free";
                    font-weight: 900;
                    color: var(--accent-blue);
                }

                .signup-btn {
                    background-color: var(--bg-tertiary);
                    color: var(--text-primary);
                    padding: 8px 16px;
                    border-radius: 6px;
                    font-weight: 500;
                    text-decoration: none;
                    border: 1px solid var(--border-color);
                    transition: all 0.2s;
                    font-size: 0.9rem;
                }
                .signup-btn:hover { background-color: var(--border-color); }

                /* Toggle Switch */
                .toggle-container {
                    display: flex;
                    align-items: center;
                    gap: 12px;
                    color: var(--text-secondary) !important;
                    font-weight: 500;
                    font-size: 0.9rem;
                    margin-right: 20px;
                }
                
                .switch {
                    position: relative;
                    display: inline-block;
                    width: 40px;
                    height: 22px;
                }
                
                .switch input { opacity: 0; width: 0; height: 0; }
                
                .slider {
                    position: absolute;
                    cursor: pointer;
                    top: 0; left: 0; right: 0; bottom: 0;
                    background-color: var(--bg-tertiary);
                    transition: .3s;
                    border-radius: 34px;
                }
                
                .slider:before {
                    position: absolute;
                    content: "";
                    height: 16px; width: 16px;
                    left: 3px; bottom: 3px;
                    background-color: var(--text-primary);
                    transition: .3s;
                    border-radius: 50%;
                }
                
                input:checked + .slider { background-color: var(--accent-blue); }
                input:checked + .slider:before { transform: translateX(18px); }

                /* Layout */
                .container {
                    max-width: 1600px;
                    margin: 0 auto;
                    padding: 0 24px;
                    display: grid;
                    grid-template-columns: 3fr 1fr;
                    gap: 32px;
                    align-items: start;
                }

                .main-column { width: 100%; }
                .side-column { position: sticky; top: 24px; }

                /* Cards Grid */
                #prototype-list {
                    display: block;
                    width:100%;
                }
                
                @media (max-width: 1400px) { #prototype-list { grid-template-columns: repeat(3, 1fr); } }
                @media (max-width: 1100px) { #prototype-list { grid-template-columns: repeat(2, 1fr); } }
                @media (max-width: 768px) { 
                    .container { grid-template-columns: 1fr; } 
                    #prototype-list { grid-template-columns: 1fr; }
                    .side-column { display: none; } /* Hide video on mobile for cleanliness */
                }

                .card {
            background-color: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 16px; /* Reduced from 20px for compactness */
            transition: transform 0.2s, box-shadow 0.2s;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden; 
        }

        .card.active {
            overflow: visible; /* Allow expansion in active state */
        }

        .prototype-card:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-sm);
            border-color: var(--accent-blue);
        }

        /* Active Card Expansion */
        .prototype-card.active {
                grid-column: 1 / -1; /* Full width */
                border-left: 4px solid var(--accent-green);
                background-color: #161f2e;
                overflow: visible; /* Allow content to flow naturally */
            }

            .prototype-card.active details {
                    margin-bottom: 15px;
                    width: 100%;
                }

                .prototype-card.active details[open] {
                    overflow: visible;
                }

                .prototype-card.active .architecture-diagram {
                    background-color: var(--bg-tertiary);
                    padding: 20px;
                    border-radius: 8px;
                    overflow: hidden;
                    width: 100%;
                }

                .prototype-card.active .deployment-info {
                    width: 100%;
                    overflow: visible;
                }

              .card-header {
                  display: flex !important;
                  flex-direction: row !important; /* Force side-by-side */
