  GetGithubRepoApi:
    Type: AWS::ApiGateway::RestApi
    Properties:
      Name: GetGithubRepoApi
      Description: API for GetGithubRepo Lambda function

  GetGithubRepoResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref GetGithubRepoApi
      ParentId: !GetAtt GetGithubRepoApi.RootResourceId
      PathPart: 'default'

  GetGithubRepoMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref GetGithubRepoApi
      ResourceId: !Ref GetGithubRepoResource
      HttpMethod: GET
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub 'arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${GetGithubRepoFunction.Arn}/invocations'

  GetGithubRepoOptionsMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref GetGithubRepoApi
      ResourceId: !Ref GetGithubRepoResource
      HttpMethod: OPTIONS
      AuthorizationType: NONE
      Integration:
        Type: MOCK
        IntegrationResponses:
          - StatusCode: 200
            ResponseParameters:
              method.response.header.Access-Control-Allow-Headers: "'Content-Type,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token'"
              method.response.header.Access-Control-Allow-Methods: "'GET,OPTIONS'"
              method.response.header.Access-Control-Allow-Origin: "'*'"
        RequestTemplates:
          application/json: '{"statusCode": 200}'
      MethodResponses:
        - StatusCode: 200
          ResponseParameters:
            method.response.header.Access-Control-Allow-Headers: true
            method.response.header.Access-Control-Allow-Methods: true
            method.response.header.Access-Control-Allow-Origin: true

  GetGithubRepoApiDeployment:
    Type: AWS::ApiGateway::Deployment
    DependsOn:
      - GetGithubRepoMethod
      - GetGithubRepoOptionsMethod
    Properties:
      RestApiId: !Ref GetGithubRepoApi
      StageName: default

  GetGithubRepoPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !GetAtt GetGithubRepoFunction.Arn
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${GetGithubRepoApi}/*'

# STATS from DYNAMODB

  StatsFetcherRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: DynamoDBAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:Scan
                  - dynamodb:Query
                Resource: '*'  
                
              # We'll need to access any prototype's DynamoDB table

  StatsFetcherFunction:
    Type: AWS::Lambda::Function
    DependsOn: StatsFetcherRole
    Properties:
      Handler: index.handler
      Role: !GetAtt StatsFetcherRole.Arn
      Runtime: python3.9
      Timeout: 30
      Code:
        ZipFile: |
          import boto3
          import json
          from decimal import Decimal
          import time

          # Price per million tokens (as of March 2025)

          MODEL_PRICING = {
            # --- Claude Family (Foundation Model IDs) ---
            "anthropic.claude-sonnet-4-5-20250929-v1:0": {"input": Decimal('3.00'), "output": Decimal('15.00')}, # Est.
            "anthropic.claude-haiku-4-5-20251001-v1:0": {"input": Decimal('0.25'), "output": Decimal('1.25')},   # Est.
            "anthropic.claude-opus-4-5-20251101-v1:0": {"input": Decimal('15.00'), "output": Decimal('75.00')}, # Est.
            "anthropic.claude-3-7-sonnet-20250219-v1:0": {"input": Decimal('3.00'), "output": Decimal('15.00')},
            "anthropic.claude-3-5-sonnet-20241022-v2:0": {"input": Decimal('3.00'), "output": Decimal('15.00')},
            "anthropic.claude-3-5-sonnet-20240620-v1:0": {"input": Decimal('3.00'), "output": Decimal('15.00')},
            "anthropic.claude-3-5-haiku-20241022-v1:0": {"input": Decimal('0.25'), "output": Decimal('1.25')},
            "anthropic.claude-3-sonnet-20240229-v1:0": {"input": Decimal('3.00'), "output": Decimal('15.00')},
            "anthropic.claude-3-haiku-20240307-v1:0": {"input": Decimal('0.25'), "output": Decimal('1.25')},
            "anthropic.claude-3-opus-20240229-v1:0": {"input": Decimal('15.00'), "output": Decimal('75.00')},
            
            # --- Claude Family (System Profile IDs - with us. prefix) ---
            "us.anthropic.claude-3-7-sonnet-20250219-v1:0": {"input": Decimal('3.00'), "output": Decimal('15.00')},
            "us.anthropic.claude-3-5-sonnet-20241022-v2:0": {"input": Decimal('3.00'), "output": Decimal('15.00')},
            "us.anthropic.claude-3-5-haiku-20241022-v1:0": {"input": Decimal('0.25'), "output": Decimal('1.25')},
            "us.anthropic.claude-3-opus-20240229-v1:0": {"input": Decimal('15.00'), "output": Decimal('75.00')},

            # --- Amazon Nova 2 Family (Using Nova 1 pricing as baseline) ---
            "amazon.nova-2-pro-v1:0": {"input": Decimal('0.80'), "output": Decimal('3.20')},
            "amazon.nova-2-lite-v1:0": {"input": Decimal('0.06'), "output": Decimal('0.24')},
            "amazon.nova-2-micro-v1:0": {"input": Decimal('0.035'), "output": Decimal('0.14')},
            "amazon.nova-2-sonic-v1:0": {"input": Decimal('3.75'), "output": Decimal('30.00')}, # Audio/Text mix est.

            # --- Amazon Nova 1 Family ---
            "amazon.nova-pro-v1:0": {"input": Decimal('0.80'), "output": Decimal('3.20')},
            "amazon.nova-lite-v1:0": {"input": Decimal('0.06'), "output": Decimal('0.24')},
            "amazon.nova-micro-v1:0": {"input": Decimal('0.035'), "output": Decimal('0.14')},

            # --- Amazon Titan ---
            "amazon.titan-text-premier-v1:0": {"input": Decimal('0.50'), "output": Decimal('1.50')},
            "amazon.titan-text-express-v1": {"input": Decimal('0.20'), "output": Decimal('0.60')},
            "amazon.titan-text-lite-v1": {"input": Decimal('0.15'), "output": Decimal('0.20')},
            "amazon.titan-embed-text-v1": {"input": Decimal('0.02'), "output": Decimal('0.00')},

            # --- Meta Llama 3.x Family ---
            "meta.llama3-3-70b-instruct-v1:0": {"input": Decimal('0.72'), "output": Decimal('0.72')},
            "meta.llama3-2-90b-instruct-v1:0": {"input": Decimal('2.00'), "output": Decimal('2.00')},
            "meta.llama3-2-11b-instruct-v1:0": {"input": Decimal('0.16'), "output": Decimal('0.16')},
            "meta.llama3-2-3b-instruct-v1:0": {"input": Decimal('0.15'), "output": Decimal('0.15')},
            "meta.llama3-2-1b-instruct-v1:0": {"input": Decimal('0.10'), "output": Decimal('0.10')},
            "meta.llama3-1-405b-instruct-v1:0": {"input": Decimal('2.40'), "output": Decimal('2.40')},
            "meta.llama3-1-70b-instruct-v1:0": {"input": Decimal('0.72'), "output": Decimal('0.72')},
            "meta.llama3-1-8b-instruct-v1:0": {"input": Decimal('0.30'), "output": Decimal('0.60')},
            
            # --- Mistral ---
            "mistral.mistral-7b-instruct-v0:2": {"input": Decimal('0.15'), "output": Decimal('0.20')}
          }

          # Helper class to convert Decimal to float for JSON serialization
          class DecimalEncoder(json.JSONEncoder):
              def default(self, o):
                  if isinstance(o, Decimal):
                      return float(o)
                  return super(DecimalEncoder, self).default(o)

          def handler(event, context):
              try:
                  # Parse request
                  body = json.loads(event['body']) if 'body' in event else {}
                  #table_name = 'bedrock-chat-logs-23e6c2d0' 
                  table_name = body.get('tableName')

                  
                  if not table_name:
                      return {
                          'statusCode': 400,
                          'headers': {
                              'Access-Control-Allow-Origin': '*',
                              'Access-Control-Allow-Headers': 'Content-Type',
                              'Access-Control-Allow-Methods': 'OPTIONS,POST'
                          },
                          'body': json.dumps({'error': 'Table name is required'})
                      }
                  
                  # Initialize DynamoDB client
                  dynamodb = boto3.resource('dynamodb')
                  table = dynamodb.Table(table_name)
                  
                  # Scan the table (with projection to reduce data transfer)
                  response = table.scan(
                      ProjectionExpression="latency_ms, bedrock_latency_ms, input_tokens, output_tokens, total_tokens, model_id, original_model_id"
                  )
                  
                  items = response.get('Items', [])
                  
                  # Process the results
                  message_count = len(items)
                  total_input_tokens = Decimal('0')
                  total_output_tokens = Decimal('0')
                  total_latency = Decimal('0')
                  model_usage = {}
                  
                  for item in items:
                      # Count tokens - convert to Decimal to ensure consistent type handling
                      input_tokens = Decimal(str(item.get('input_tokens', 0)))
                      output_tokens = Decimal(str(item.get('output_tokens', 0)))
                      total_input_tokens += input_tokens
                      total_output_tokens += output_tokens
                      
                      # Track latency
                      latency = Decimal(str(item.get('latency_ms', 0)))
                      total_latency += latency
                      
                      # Track model usage for cost calculation
                      # CRITICAL FIX: Use original_model_id (for cost tracking) if available, 
                      # otherwise fallback to model_id
                      model_id = item.get('original_model_id') or item.get('model_id', 'unknown')
                      
                      if model_id not in model_usage:
                          model_usage[model_id] = {
                              'input_tokens': Decimal('0'),
                              'output_tokens': Decimal('0'),
                              'count': 0
                          }
                      
                      model_usage[model_id]['input_tokens'] += input_tokens
                      model_usage[model_id]['output_tokens'] += output_tokens
                      model_usage[model_id]['count'] += 1
                  
                  # Calculate costs
                  total_cost = Decimal('0')
                  model_costs = {}
                  
                  for model_id, usage in model_usage.items():
                      if model_id in MODEL_PRICING:
                          million = Decimal('1000000')
                          input_cost = (usage['input_tokens'] / million) * MODEL_PRICING[model_id]['input']
                          output_cost = (usage['output_tokens'] / million) * MODEL_PRICING[model_id]['output']
                          model_cost = input_cost + output_cost
                          
                          model_costs[model_id] = {
                              'input_cost': input_cost,
                              'output_cost': output_cost,
                              'total_cost': model_cost,
                              'count': usage['count']
                          }
                          
                          total_cost += model_cost
                  
                  message_count_safe = max(1, message_count)
                  
                  stats = {
                      'message_count': message_count,
                      'total_input_tokens': total_input_tokens,
                      'total_output_tokens': total_output_tokens,
                      'total_tokens': total_input_tokens + total_output_tokens,
                      'average_tokens_per_message': (total_input_tokens + total_output_tokens) / Decimal(str(message_count_safe)),
                      'total_cost_usd': total_cost,
                      'average_cost_per_message': total_cost / Decimal(str(message_count_safe)),
                      'average_latency_ms': total_latency / Decimal(str(message_count_safe)),
                      'model_costs': model_costs
                  }
                  
                  return {
                      'statusCode': 200,
                      'headers': {
                          'Access-Control-Allow-Origin': '*',
                          'Access-Control-Allow-Headers': 'Content-Type',
                          'Access-Control-Allow-Methods': 'OPTIONS,POST'
                      },
                      'body': json.dumps(stats, cls=DecimalEncoder)
                  }
                  
              except Exception as e:
                  error_msg = str(e)
                  print(f"Error: {error_msg}")
                  
                  # If table doesn't exist or is being deleted, return zeros instead of error
                  if 'ResourceNotFoundException' in error_msg or 'does not exist' in error_msg or 'Cannot do operations on a non-existent table' in error_msg:
                      return {
                          'statusCode': 200,
                          'headers': {
                              'Access-Control-Allow-Origin': '*',
                              'Access-Control-Allow-Headers': 'Content-Type',
                              'Access-Control-Allow-Methods': 'OPTIONS,POST'
                          },
                          'body': json.dumps({
                              'message_count': 0,
                              'total_input_tokens': 0,
                              'total_output_tokens': 0,
                              'total_tokens': 0,
                              'average_tokens_per_message': 0,
                              'total_cost_usd': 0,
                              'average_cost_per_message': 0,
                              'average_latency_ms': 0,
                              'model_costs': {}
                          })
                      }
                  
                  # For other errors, return error response
                  return {
                      'statusCode': 500,
                      'headers': {
                          'Access-Control-Allow-Origin': '*',
                          'Access-Control-Allow-Headers': 'Content-Type',
                          'Access-Control-Allow-Methods': 'OPTIONS,POST'
                      },
                      'body': json.dumps({'error': error_msg})
                  }

