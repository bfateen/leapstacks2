                                        thinkingEl.style.opacity = '0.7';
                                        chatContainer.appendChild(thinkingEl);
                                    }
                                    thinkingEl.textContent = '' + text;
                                    chatContainer.scrollTop = chatContainer.scrollHeight;
                                }

                                // Helper to finalize assistant message
                                function setAssistantText(t) {
                                    if (thinkingEl) {
                                        thinkingEl.remove();
                                        thinkingEl = null;
                                    }
                                    if (!assistantEl) {
                                        assistantEl = appendMessageToChat('', 'assistant');
                                    }
                                    assistantText = t;
                                    assistantEl.textContent = assistantText;
                                    chatContainer.scrollTop = chatContainer.scrollHeight;
                                }

                                try {
                                    const response = await fetch(apiUrl, {
                                        method: 'POST',
                                        headers: { 'Content-Type': 'application/json' },
                                        body: JSON.stringify({ prompt: message, sessionId })
                                    });

                                    const reader = response.body.getReader();
                                    const decoder = new TextDecoder('utf-8');
                                    let buffer = '';
                                    const NL = String.fromCharCode(10);

                                    while (true) {
                                        const { value, done } = await reader.read();
                                        if (done) break;

                                        buffer += decoder.decode(value, { stream: true });
                                        const parts = buffer.split(NL + NL);
                                        buffer = parts.pop() || '';

                                        for (const part of parts) {
                                            const lines = part.split(NL);
                                            for (const line of lines) {
                                                if (!line.startsWith('data:')) continue;

                                                // 1. Remove the outer 'data:' prefix
                                                let rawPayload = line.slice(5).trim();
                                                if (!rawPayload) continue;

                                                let evt;
                                                try {
                                                    // 2. Parse the outer JSON
                                                    evt = JSON.parse(rawPayload);

                                                    // 3. INTERNAL UNWRAPPING: 
                                                    // If the parsed object is a string starting with 'data:', 
                                                    // it means the stream is double-encoded. We must parse it again.
                                                    if (typeof evt === 'string' && evt.startsWith('data:')) {
                                                        const innerJson = evt.replace('data:', '').trim();
                                                        evt = JSON.parse(innerJson);
                                                    }
                                                } catch (e) {
                                                    console.error('Failed to parse:', rawPayload);
                                                    continue;
                                                }

                                                // 4. Handle types using the unwrapped 'evt' object
                                                if (evt.type === 'thinking') {
                                                    updateThinking(evt.message);
                                                }
                                                else if (evt.type === 'error') {
                                                    const errEl = appendMessageToChat('⚠️ ' + evt.message, 'assistant');
                                                    errEl.style.backgroundColor = '#450a0a';
                                                    errEl.style.border = '1px solid #991b1b';
                                                    if (thinkingEl) thinkingEl.remove();
                                                }
                                                else if (evt.type === 'done') {
                                                    if (thinkingEl) thinkingEl.remove();
                                                    console.log("Stream complete");
                                                }
                                                else if (evt.type === 'message') {
                                                    // Handle the final message with content field
                                                    const text = evt.content || evt.text || evt.delta || '';
                                                    if (text) {
                                                        setAssistantText(text);
                                                    }
                                                }
                                                else {
                                                    const chunk = evt.text || evt.delta || (evt.message && evt.type !== 'thinking' ? evt.message : '');
                                                    if (chunk) {
                                                        if (thinkingEl) {
                                                            thinkingEl.remove();
                                                            thinkingEl = null;
                                                        }
                                                        if (!assistantEl) assistantEl = appendMessageToChat('', 'assistant');
                                                        assistantText += chunk;
                                                        assistantEl.textContent = assistantText;
                                                    }
                                                }
                                            }
                                        }
                                    }
                                } catch (error) {
                                    console.error('Error:', error);
                                    appendMessageToChat('Error: Connection failed', 'assistant');
                                }
                            }
                              
                              function appendMessageToChat(messageText, senderType) {
                                  const messageElement = document.createElement('div');
                                  messageElement.className = 'message ' + senderType + '-message';
                                  messageElement.textContent = messageText;
                                  chatContainer.appendChild(messageElement);
                                  chatContainer.scrollTop = chatContainer.scrollHeight;
                                  return messageElement;
                              }
                          </script>
                      </body>
                      </html>
                      """
                      
                      html_content = html_content.replace('API_ENDPOINT_PLACEHOLDER', api_endpoint)

                      s3.put_object(
                          Bucket=bucket_name,
                          Key='index.html',
                          Body=html_content,
                          ContentType='text/html'
                      )
                      
                      presigned_url = s3.generate_presigned_url(
                          'get_object',
                          Params={
                              'Bucket': bucket_name,
                              'Key': 'index.html'
                          },
                          ExpiresIn=604800
                      )
                      
                      responseData = {
                          'SignedURL': presigned_url
                      }
                      
                      cfnresponse.send(event, context, cfnresponse.SUCCESS, responseData)
                  except Exception as e:
                      print(f"Error: {str(e)}")
                      cfnresponse.send(event, context, cfnresponse.FAILED, {})
              else:
                  cfnresponse.send(event, context, cfnresponse.SUCCESS, {})
      Runtime: python3.9
      Timeout: 30

  AgentCoreProxyRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: AgentCoreInvokePolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - bedrock-agentcore:InvokeAgentRuntime
                  # or bedrock-agent-runtime:InvokeAgentRuntime if you're on that API
                Resource: '*'   # you can later restrict to AgentCoreRuntime.AgentRuntimeArn

  AgentCoreProxyFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${AgentName}-agentcore-proxy'
      Runtime: python3.11
      Handler: index.handler
      Role: !GetAtt AgentCoreProxyRole.Arn
      Timeout: 30
      MemorySize: 256
      Environment:
        Variables:
          AGENT_RUNTIME_ARN: !GetAtt AgentCoreRuntime.AgentRuntimeArn
          REGION: !Ref AWS::Region
      Code:
        ZipFile: |
          import boto3, json, os, time
          import uuid

          client = boto3.client('bedrock-agentcore', region_name=os.environ['REGION'])
          # if you're using the older naming, use 'bedrock-agent-runtime'

          def _resp(code, body):
              return {
                  'statusCode': code,
                  'headers': {
                      'Content-Type': 'application/json',
                      'Access-Control-Allow-Origin': '*',
                      'Access-Control-Allow-Headers': 'Content-Type',
                      'Access-Control-Allow-Methods': 'POST,OPTIONS'
                  },
                  'body': json.dumps(body)
              }

          def handler(event, context):
              if event.get('httpMethod') == 'OPTIONS':
                  return _resp(200, {})

              try:
                  body = json.loads(event.get('body') or '{}')
              except Exception:
                  body = {}

              prompt = body.get('prompt', 'Hello! How can I help you today?')
              raw_session = body.get('sessionId') or f"web-session-{int(time.time())}"

              if len(raw_session) < 33:
                  raw_session = raw_session + "-" + uuid.uuid4().hex

              session_id = raw_session[:128]  # hard cap 

              payload = json.dumps({"prompt": prompt}).encode()

              resp = client.invoke_agent_runtime(
                  agentRuntimeArn=os.environ['AGENT_RUNTIME_ARN'],
                  runtimeSessionId=session_id,
                  payload=payload,
              )

              # Handle both streaming/non-streaming JSON
              if resp.get("contentType") == "application/json":
                  chunks = [c.decode("utf-8") for c in resp.get("response", [])]
                  data = json.loads("".join(chunks)) if chunks else {}
              else:
                  data = {"raw": "Non-JSON response from AgentCore Runtime"}

              return _resp(200, data)

  # ---------------------------------------------------------------------------
  # Real-time streaming (SSE) endpoint: /invoke-stream
  #
  # This uses API Gateway REST API response streaming + a response-streaming
  # enabled Lambda to proxy AgentCore Runtime's SSE events end-to-end.
  # ---------------------------------------------------------------------------

  AgentCoreStreamProxyRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: AgentCoreInvokePolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - bedrock-agentcore:InvokeAgentRuntime
                Resource: '*'

  AgentCoreStreamProxyFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${AgentName}-agentcore-proxy-stream'
      Runtime: nodejs20.x
      Handler: index.handler
      Role: !GetAtt AgentCoreStreamProxyRole.Arn
      Timeout: 60
      MemorySize: 512
      Environment:
        Variables:
          AGENT_RUNTIME_ARN: !GetAtt AgentCoreRuntime.AgentRuntimeArn
      Code:
        ZipFile: |
          // AWS SDK v3 BedrockAgentCore client - included in Lambda Node.js 20 runtime
          const { BedrockAgentCoreClient, InvokeAgentRuntimeCommand } = require('@aws-sdk/client-bedrock-agentcore');
          const crypto = require('crypto');

          function writeSse(stream, obj) {
            stream.write(`data: ${JSON.stringify(obj)}\n\n`);
          }

          function safeJsonParse(s) {
            try { return JSON.parse(s); } catch { return null; }
          }

          function parseBody(event) {
            if (!event) return {};
            if (event.body) {
              const parsed = safeJsonParse(event.body);
              return parsed || { prompt: event.body };
            }
            return {};
          }

          /**
          * Generate a session ID that meets the minimum length requirement (33 chars)
          */
          function generateSessionId(providedId) {
            if (providedId && providedId.length >= 33) {
              return providedId.slice(0, 128);
            }
            
            const uuid = crypto.randomUUID();
            const timestamp = Date.now();
            
            if (providedId) {
              return `${providedId}-${uuid}`.slice(0, 128);
            }
            
            return `web-session-${timestamp}-${uuid}`.slice(0, 128);
          }

          exports.handler = awslambda.streamifyResponse(async (event, responseStream) => {
            // CORS preflight
            if (event?.httpMethod === "OPTIONS") {
              const meta = {
                statusCode: 200,
                headers: {
                  "Access-Control-Allow-Origin": "*",
                  "Access-Control-Allow-Headers": "Content-Type",
                  "Access-Control-Allow-Methods": "POST,OPTIONS"
                }
              };
              responseStream = awslambda.HttpResponseStream.from(responseStream, meta);
              writeSse(responseStream, { type: "thinking", message: "Thinking..." });

              responseStream.end();
              return;
            }

            // SSE headers for streaming response
            const meta = {
              statusCode: 200,
              headers: {
                "Content-Type": "text/event-stream",
                "Cache-Control": "no-cache",
                "Connection": "keep-alive",
                "Access-Control-Allow-Origin": "*",
                "Access-Control-Allow-Headers": "Content-Type",
                "Access-Control-Allow-Methods": "POST,OPTIONS"
              }
            };
            responseStream = awslambda.HttpResponseStream.from(responseStream, meta);
            writeSse(responseStream, { type: "thinking", message: "Thinking..." });
            console.log("Wrote manual thinking SSE");

            const region = process.env.AWS_REGION || process.env.AWS_DEFAULT_REGION || 'us-east-1';
            const agentRuntimeArn = process.env.AGENT_RUNTIME_ARN;

            if (!agentRuntimeArn) {
              writeSse(responseStream, { type: "error", message: "Missing AGENT_RUNTIME_ARN" });
              responseStream.end();
              return;
            }

            const body = parseBody(event);
            const prompt = body.prompt ?? "";
            const rawSession = body.sessionId || body.session_id;
            const sessionId = generateSessionId(rawSession);

            try {
              const client = new BedrockAgentCoreClient({ region });

              const payload = JSON.stringify({ prompt });
              const payloadBuffer = Buffer.from(payload, 'utf-8');

              const command = new InvokeAgentRuntimeCommand({
                agentRuntimeArn: agentRuntimeArn,
                runtimeSessionId: sessionId,
                payload: payloadBuffer,
                accept: 'text/event-stream',
                contentType: 'application/json',
              });

              const response = await client.send(command);

              // Handle the response
              if (response.response) {
                const responseBody = response.response;
                
                // Check if it's a streaming response (text/event-stream)
                if (response.contentType && response.contentType.includes('text/event-stream')) {
                  // Stream the SSE events directly
                  if (typeof responseBody[Symbol.asyncIterator] === 'function') {
                    for await (const chunk of responseBody) {
                      if (Buffer.isBuffer(chunk)) {
                        responseStream.write(chunk);
                      } else if (chunk instanceof Uint8Array) {
                        responseStream.write(Buffer.from(chunk));
                      } else if (typeof chunk === 'string') {
                        responseStream.write(chunk);
                      }
                    }
                  } else if (typeof responseBody.transformToString === 'function') {
                    const text = await responseBody.transformToString();
                    responseStream.write(text);
                  }
                } 
                // Handle JSON response (non-streaming)
                else if (response.contentType && response.contentType.includes('application/json')) {
                  let text;
                  if (typeof responseBody.transformToString === 'function') {
                    text = await responseBody.transformToString();
                  } else if (typeof responseBody[Symbol.asyncIterator] === 'function') {
                    const chunks = [];
                    for await (const chunk of responseBody) {
                      chunks.push(Buffer.isBuffer(chunk) ? chunk : Buffer.from(chunk));
                    }
                    text = Buffer.concat(chunks).toString('utf-8');
                  }
                  
                  if (text) {
                    // Parse the JSON and send as SSE event
                    const data = safeJsonParse(text) || text;
                    writeSse(responseStream, { type: 'message', content: data, sessionId: response.runtimeSessionId });
                  }
                }
                // Fallback: try to read as string
                else {
                  if (typeof responseBody.transformToString === 'function') {
                    const text = await responseBody.transformToString();
                    writeSse(responseStream, { type: 'data', content: text });
                  }
                }
              }

              // Send completion event
              writeSse(responseStream, { type: 'done', sessionId: response.runtimeSessionId });
              responseStream.end();
              
            } catch (err) {
              console.error('Handler error:', err.name, err.message);
              writeSse(responseStream, { type: "error", message: String(err?.message || err) });
              responseStream.end();
            }
          });

