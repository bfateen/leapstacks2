AWSTemplateFormatVersion: '2010-09-09'
Description: 'LEAP Prototype - Deploy Lovable app to AWS Amplify with full-stack architecture'

Parameters:
  GitHubRepo:
    Type: String
    Description: 'Full GitHub repository URL (e.g., https://github.com/username/repo)'
    Default: 'LEAP_GITHUB_REPO'
  GitHubToken:
    Type: String
    Description: 'GitHub Personal Access Token for repository access'
    NoEcho: true
    Default: 'LEAP_GITHUB_TOKEN'
  
  BranchName:
    Type: String
    Description: 'Git branch to deploy'
    Default: 'main'
  
  AppName:
    Type: String
    Description: 'Name for your Amplify application'
    Default: 'lovable-app'

Resources:
  # Amplify Application
  AmplifyApp:
    Type: AWS::Amplify::App
    Properties:
      Name: !Sub ${AppName}-${AWS::StackName}
      Repository: !Ref GitHubRepo
      AccessToken: !Ref GitHubToken
      Platform: WEB
      BuildSpec: |
        version: 1
        frontend:
          phases:
            preBuild:
              commands:
                - npm ci
            build:
              commands:
                - npm run build
          artifacts:
            baseDirectory: dist
            files:
              - '**/*'
          cache:
            paths:
              - node_modules/**/*
      CustomRules:
        - Source: '/<*>'
          Target: '/index.html'
          Status: '404-200'
      

  # Amplify Branch
  AmplifyBranch:
    Type: AWS::Amplify::Branch
    Properties:
      AppId: !GetAtt AmplifyApp.AppId
      BranchName: !Ref BranchName
      EnableAutoBuild: true
      EnablePullRequestPreview: false
      Stage: PRODUCTION

  # IAM Role for Lambda Trigger Function
  TriggerExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: AmplifyDeploymentPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - amplify:StartJob
                  - amplify:GetJob
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: 
                  - !Sub arn:${AWS::Partition}:amplify:${AWS::Region}:${AWS::AccountId}:apps/${AmplifyApp.AppId}/branches/${BranchName}/jobs/*
                  - !Sub arn:${AWS::Partition}:amplify:${AWS::Region}:${AWS::AccountId}:apps/${AmplifyApp.AppId}/*
                  - 'arn:aws:logs:*:*:*'

  # Lambda Function to Trigger Initial Build
  TriggerBuildFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub ${AWS::StackName}-trigger-build
      Runtime: python3.11
      Handler: index.handler
      Role: !GetAtt TriggerExecutionRole.Arn
      Timeout: 60
      MemorySize: 128
      Code:
        ZipFile: |
          import json
          import urllib3
          import boto3
          import traceback
          import logging
          
          logger = logging.getLogger()
          logger.setLevel(logging.INFO)
          
          http = urllib3.PoolManager()

          def send_response(event, context, status, data=None, reason=None):
              """Send CloudFormation custom resource response"""
              try:
                  response_body = {
                      "Status": status,
                      "Reason": reason or f"See CloudWatch Log Stream: {context.log_stream_name}",
                      "PhysicalResourceId": context.log_stream_name,
                      "StackId": event["StackId"],
                      "RequestId": event["RequestId"],
                      "LogicalResourceId": event["LogicalResourceId"],
                      "NoEcho": False,
                      "Data": data or {}
                  }
                  
                  encoded = json.dumps(response_body).encode("utf-8")
                  logger.info(f"Sending response to CloudFormation: {status}")
                  
                  http.request(
                      "PUT",
                      event["ResponseURL"],
                      body=encoded,
                      headers={
                          "content-type": "",
                          "content-length": str(len(encoded))
                      }
                  )
              except Exception as e:
                  logger.error(f"Error sending response: {str(e)}")

          def handler(event, context):
              """Trigger initial Amplify build on stack creation"""
              logger.info(f"Received event: {json.dumps(event)}")
              
              try:
                  request_type = event.get("RequestType")
                  
                  # Only trigger build on Create
                  if request_type != "Create":
                      logger.info(f"Skipping build trigger for {request_type} event")
                      send_response(
                          event, 
                          context, 
                          "SUCCESS", 
                          {"Message": f"No action required for {request_type}"}
                      )
                      return

                  # Extract parameters
                  amplify = boto3.client("amplify")
                  app_id = event["ResourceProperties"]["AppId"]
                  branch_name = event["ResourceProperties"]["BranchName"]
                  
                  logger.info(f"Starting Amplify build for app {app_id}, branch {branch_name}")

                  # Start the build job
                  response = amplify.start_job(
                      appId=app_id,
                      branchName=branch_name,
                      jobType="RELEASE",
                      jobReason="Initial deployment triggered by CloudFormation"
                  )
                  
                  job_id = response["jobSummary"]["jobId"]
                  logger.info(f"Successfully started build job: {job_id}")
                  
                  send_response(
                      event, 
                      context, 
                      "SUCCESS", 
                      {
                          "JobId": job_id,
                          "Message": f"Build job {job_id} started successfully"
                      }
                  )
                  
              except Exception as e:
                  error_msg = str(e)
                  logger.error(f"Error in handler: {error_msg}")
                  logger.error(traceback.format_exc())
                  send_response(
                      event, 
                      context, 
                      "FAILED", 
                      reason=f"Failed to trigger build: {error_msg}"
                  )

  # Custom Resource to Trigger Initial Build
  InitialDeployment:
    Type: Custom::AmplifyBuild
    DependsOn: AmplifyBranch
    Properties:
      ServiceToken: !GetAtt TriggerBuildFunction.Arn
      AppId: !GetAtt AmplifyApp.AppId
      BranchName: !Ref BranchName

Outputs:
  FrontendURL:
    Description: 'URL for the deployed Amplify application (Frontend)'
    Value: !Sub 'https://${BranchName}.${AmplifyApp.DefaultDomain}'
    Export:
      Name: !Sub '${AWS::StackName}-FrontendURL'
  
  BackendURL:
    Description: 'Amplify Console URL for managing the application (Backend/Admin)'
    Value: !Sub 'https://console.aws.amazon.com/amplify/home?region=${AWS::Region}#/${AmplifyApp.AppId}/${BranchName}'
    Export:
      Name: !Sub '${AWS::StackName}-BackendURL'
  
  AmplifyAppId:
    Description: 'Amplify Application ID'
    Value: !GetAtt AmplifyApp.AppId
    Export:
      Name: !Sub '${AWS::StackName}-AmplifyAppId'
  
  AmplifyAppName:
    Description: 'Amplify Application Name'
    Value: !Sub ${AppName}-${AWS::StackName}
    Export:
      Name: !Sub '${AWS::StackName}-AmplifyAppName'
  
  BranchName:
    Description: 'Deployed Git Branch'
    Value: !Ref BranchName
    Export:
      Name: !Sub '${AWS::StackName}-BranchName'
  
  GitHubRepository:
    Description: 'GitHub Repository URL'
    Value: !Ref GitHubRepo
    Export:
      Name: !Sub '${AWS::StackName}-GitHubRepo'
