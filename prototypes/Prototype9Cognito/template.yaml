              }

  # Private Page Lambda - SECURED WITH SESSION CHECK
  PrivatePageFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Join
        - "-"
        - - "private-page"
          - !Select
            - 0
            - !Split
              - "-"
              - !Select
                - 2
                - !Split
                  - "/"
                  - !Ref "AWS::StackId"
      Handler: index.handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Runtime: python3.9
      Timeout: 30
      Environment:
        Variables:
          COGNITO_DOMAIN: !Ref UserPoolDomain
          USER_POOL_ID: !Ref UserPool
          CLIENT_ID: !Ref UserPoolClient
          REGION: !Ref AWS::Region
          SESSION_TABLE: !Ref SessionTable
          COGNITO_CLIENT_ID: !Ref UserPoolClient

      Code:
        ZipFile: |
          import json
          import boto3
          import os

          dynamodb = boto3.resource('dynamodb')
          table = dynamodb.Table(os.environ['SESSION_TABLE'])

          def extract_session_id(cookies):
              if not cookies:
                  return None
              for cookie in cookies.split(';'):
                  cookie = cookie.strip()
                  if cookie.startswith('session_id='):
                      return cookie.split('=', 1)[1]
              return None

          def get_session(session_id):
              try:
                  item = table.get_item(Key={'session_id': session_id}).get('Item')
                  return item
              except Exception as e:
                  print("DDB error:", e)
                  return None

          def unauthorized_response(event):
              return {
                  "statusCode": 401,
                  "headers": {"Content-Type": "text/html"},
                  "body": "<h1>Unauthorized</h1>"
              }

          def handler(event, context):
              print(f"Private page event: {json.dumps(event)}")

              # ---- COOKIE HANDLING BLOCK (SAFE) ----
              headers = event.get('headers', {}) or {}

              cookie_header = (
                  headers.get('Cookie') or
                  headers.get('cookie') or
                  ''
              )

              # API Gateway HTTP API (cookies: [])
              if not cookie_header and isinstance(event.get("cookies"), list):
                  cookie_header = "; ".join(event["cookies"])

              session_id = extract_session_id(cookie_header)
              if not session_id:
                  return unauthorized_response(event)

              session = get_session(session_id)
              if not session:
                  return unauthorized_response(event)
              # ---- END COOKIE BLOCK ----

              email = session.get("email", "Unknown")

              # Build logout URL
              # Build logout URL (COGNITO_DOMAIN is a prefix; make it a full host)
              cognito_prefix = os.environ["COGNITO_DOMAIN"]   
              region = os.environ["REGION"]
              client_id = os.environ["COGNITO_CLIENT_ID"]

              stage = event["requestContext"]["stage"]
              host = event["headers"].get("Host")
              post_logout = f"https://{host}/{stage}/"

              cognito_host = f"{cognito_prefix}.auth.{region}.amazoncognito.com"
              logout_url = (
                  f"https://{cognito_host}/logout"
                  f"?client_id={client_id}"
                  f"&logout_uri={post_logout}"
              )


              # HTML response 
              html = f"""
              <html>
                <body style='font-family:sans-serif;'>
                  <h1>Private Page</h1>
                  <p>Welcome, {email}</p>

                  <button onclick="logout()" 
                          style="padding:10px 16px;background:#0d9488;color:#fff;border:none;border-radius:6px;cursor:pointer;">
                    Sign Out
                  </button>

                  <script>
                    function logout() {{
                      // JS comment is SAFE because this is inside a Python string
                      document.cookie = "session_id=; Max-Age=0; Path=/; SameSite=None; Secure";
                      window.location.href = "{logout_url}";
                    }}
                  </script>
                </body>
              </html>
              """

              return {
                  "statusCode": 200,
                  "headers": {"Content-Type": "text/html"},
                  "body": html
              }


  # Landing Page Lambda
  LandingPageFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Join
        - "-"
        - - "landing"
          - !Select
            - 0
            - !Split
              - "-"
              - !Select
                - 2
                - !Split
                  - "/"
                  - !Ref "AWS::StackId"
      Handler: index.handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Runtime: python3.9
      Timeout: 30
      Environment:
        Variables:
          COGNITO_DOMAIN: !Ref UserPoolDomain
          CLIENT_ID: !Ref UserPoolClient
          REGION: !Ref AWS::Region
      Code:
        ZipFile: |
          import json
          import os
          import urllib.parse
          
          def handler(event, context):
              cognito_domain = os.environ['COGNITO_DOMAIN']
              client_id = os.environ['CLIENT_ID']
              region = os.environ['REGION']
              
              # Get the API Gateway URL from the request
              api_url = f"https://{event['requestContext']['domainName']}/{event['requestContext']['stage']}"
              callback_url = f"{api_url}/callback"
              
              login_url = f"https://{cognito_domain}.auth.{region}.amazoncognito.com/login?client_id={client_id}&response_type=code&scope=email+openid+profile&redirect_uri={urllib.parse.quote(callback_url)}"
              signup_url = f"https://{cognito_domain}.auth.{region}.amazoncognito.com/signup?client_id={client_id}&response_type=code&scope=email+openid+profile&redirect_uri={urllib.parse.quote(callback_url)}"
              
              html = f'''<!DOCTYPE html>
          <html><head><title>Welcome</title><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
          <style>*{{margin:0;padding:0;box-sizing:border-box}}body{{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:linear-gradient(135deg,#667eea,#764ba2);min-height:100vh;display:flex;justify-content:center;align-items:center;padding:20px}}.container{{background:#fff;border-radius:16px;padding:50px;max-width:500px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,0.3);text-align:center}}h1{{color:#333;font-size:32px;margin-bottom:10px}}p{{color:#666;margin-bottom:40px;font-size:16px}}.btn-group{{display:flex;flex-direction:column;gap:15px}}.btn{{padding:16px 32px;border:none;border-radius:8px;font-size:16px;font-weight:600;cursor:pointer;text-decoration:none;display:inline-block;transition:all 0.2s}}.btn-primary{{background:linear-gradient(135deg,#667eea,#764ba2);color:#fff}}.btn-primary:hover{{transform:translateY(-2px);box-shadow:0 4px 12px rgba(102,126,234,0.4)}}.btn-secondary{{background:#f8f9fa;color:#333;border:2px solid #e0e0e0}}.btn-secondary:hover{{background:#e9ecef}}.info{{margin-top:30px;padding-top:30px;border-top:1px solid #e0e0e0;color:#999;font-size:14px}}</style>
          </head><body><div class="container"><h1>🔐 Welcome</h1>
          <p>Secure authentication with admin approval</p>
          <div class="btn-group"><a href="{login_url}" class="btn btn-primary">Sign In</a>
          <a href="{signup_url}" class="btn btn-secondary">Create Account</a></div>
          <div class="info"><p><strong>Note:</strong> New accounts require admin approval before you can access private content.</p></div></div></body></html>'''
              
              return {
                  'statusCode': 200,
                  'headers': {'Content-Type': 'text/html'},
                  'body': html
              }

  # Update UserPool with Lambda Triggers
  UserPoolTriggerUpdaterRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: CognitoUpdate
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - cognito-idp:UpdateUserPool
                  - cognito-idp:DescribeUserPool
                Resource: !GetAtt UserPool.Arn

  UserPoolTriggerUpdater:
    Type: AWS::Lambda::Function
    Properties:
      Handler: index.handler
      Role: !GetAtt UserPoolTriggerUpdaterRole.Arn
      Runtime: python3.9
      Timeout: 30
      Code:
        ZipFile: |
          import boto3
          import cfnresponse
          import logging
          
          logger = logging.getLogger()
          logger.setLevel(logging.INFO)
          
          def handler(event, context):
              try:
                  if event['RequestType'] in ['Create', 'Update']:
                      cognito = boto3.client('cognito-idp')
                      user_pool_id = event['ResourceProperties']['UserPoolId']
                      presignup_arn = event['ResourceProperties']['PreSignUpArn']
                      preauth_arn = event['ResourceProperties']['PreAuthArn']
                      
                      cognito.update_user_pool(
                          UserPoolId=user_pool_id,
                          LambdaConfig={
                              'PreSignUp': presignup_arn,
                              'PreAuthentication': preauth_arn
                          }
                      )
                      
                      logger.info(f"Updated UserPool {user_pool_id} with triggers")
                      cfnresponse.send(event, context, cfnresponse.SUCCESS, {})
                  else:
                      cfnresponse.send(event, context, cfnresponse.SUCCESS, {})
              except Exception as e:
                  logger.error(f"Error: {str(e)}")
                  cfnresponse.send(event, context, cfnresponse.FAILED, {})

  UpdateUserPoolTriggers:
    Type: Custom::UserPoolUpdate
    DependsOn:
      - PreSignUpFunction
      - PreSignUpPermission
      - PreAuthFunction
      - PreAuthPermission
      - UserPool
    Properties:
      ServiceToken: !GetAtt UserPoolTriggerUpdater.Arn
      UserPoolId: !Ref UserPool
      PreSignUpArn: !GetAtt PreSignUpFunction.Arn
      PreAuthArn: !GetAtt PreAuthFunction.Arn

  # API Gateway
  AppAPI:
    Type: AWS::ApiGateway::RestApi
    Properties:
      Name: !Join
        - "-"
        - - "app-api"
          - !Select
            - 0
            - !Split
              - "-"
              - !Select
                - 2
                - !Split
                  - "/"
                  - !Ref "AWS::StackId"
      EndpointConfiguration:
        Types:
          - REGIONAL

  # Root method for landing page
  RootMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      AuthorizationType: NONE
      HttpMethod: GET
      ResourceId: !GetAtt AppAPI.RootResourceId
      RestApiId: !Ref AppAPI
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${LandingPageFunction.Arn}/invocations

  # Admin resource
  AdminResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      ParentId: !GetAtt AppAPI.RootResourceId
      PathPart: admin
      RestApiId: !Ref AppAPI

  AdminProxyResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      ParentId: !Ref AdminResource
      PathPart: '{proxy+}'
      RestApiId: !Ref AppAPI

  AdminMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      AuthorizationType: NONE
      HttpMethod: ANY
      ResourceId: !Ref AdminResource
      RestApiId: !Ref AppAPI
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${AdminAPIFunction.Arn}/invocations

  AdminProxyMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      AuthorizationType: NONE
      HttpMethod: ANY
      ResourceId: !Ref AdminProxyResource
      RestApiId: !Ref AppAPI
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${AdminAPIFunction.Arn}/invocations

  # Callback resource
  CallbackResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      ParentId: !GetAtt AppAPI.RootResourceId
      PathPart: callback
      RestApiId: !Ref AppAPI

  CallbackMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      AuthorizationType: NONE
      HttpMethod: GET
      ResourceId: !Ref CallbackResource
      RestApiId: !Ref AppAPI
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${CallbackFunction.Arn}/invocations

  # Private resource
  PrivateResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      ParentId: !GetAtt AppAPI.RootResourceId
      PathPart: private
      RestApiId: !Ref AppAPI

  PrivateMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      AuthorizationType: NONE
      HttpMethod: GET
      ResourceId: !Ref PrivateResource
      RestApiId: !Ref AppAPI
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${PrivatePageFunction.Arn}/invocations

  # API Deployment
  ApiDeployment:
    Type: AWS::ApiGateway::Deployment
    DependsOn:
      - RootMethod
      - AdminMethod
      - AdminProxyMethod
      - CallbackMethod
      - PrivateMethod
    Properties:
      RestApiId: !Ref AppAPI

  ApiStage:
    Type: AWS::ApiGateway::Stage
    Properties:
      DeploymentId: !Ref ApiDeployment
      RestApiId: !Ref AppAPI
      StageName: prod

  # Lambda Permissions
  LandingPagePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref LandingPageFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${AppAPI}/*/*/*

  AdminAPIPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref AdminAPIFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${AppAPI}/*/*/*

  CallbackPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref CallbackFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${AppAPI}/*/*/*

  PrivatePagePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref PrivatePageFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${AppAPI}/*/*/*

  ManagedLoginBranding:
    Type: AWS::Cognito::ManagedLoginBranding
    Properties:
      UserPoolId: !Ref UserPool
      ClientId: !Ref UserPoolClient         # assign branding to your existing app client
      UseCognitoProvidedValues: false
      ReturnMergedResources: false
      Settings:
        categories:
          global:
            colorSchemeMode: LIGHT          # overall light theme
            pageHeader: { enabled: false }
            pageFooter: { enabled: false }
            spacingDensity: REGULAR
          form:
            displayGraphics: true
            location:
              horizontal: CENTER
              vertical: CENTER
            # (instructions/languageSelector/sessionTimerDisplay are reserved; omit)
          auth:
            authMethodOrder:
              - - display: INPUT
                  type: USERNAME_PASSWORD
            federation:
              interfaceStyle: BUTTON_LIST
              order: []                      # keep empty if you don't show IdPs
        componentClasses:
          buttons:                           # only borderRadius here
            borderRadius: 8.0
          focusState:
            lightMode:
              borderColor: "0d9488ff"        # teal focus ring
          input:
            borderRadius: 8.0
            lightMode:
              defaults:
                backgroundColor: "ffffffff"
                borderColor: "cbd5e1ff"
              placeholderColor: "5f6b7aff"
          inputLabel:
            lightMode:
              textColor: "000716ff"
          inputDescription:
            lightMode:
              textColor: "5f6b7aff"
          link:
            lightMode:
              defaults:
                textColor: "0d9488ff"        # teal links
              hover:
                textColor: "0f766eff"
          divider:
            lightMode:
              borderColor: "ebebf0ff"
         






Outputs:
