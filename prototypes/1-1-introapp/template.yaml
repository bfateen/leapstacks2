AWSTemplateFormatVersion: '2010-09-09'
Description: 'Simple photo gallery with S3 storage - Perfect for learning AWS object storage fundamentals'

Resources:
  # S3 Bucket for storing photos
  PhotoStorageBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      BucketName: !Join
        - "-"
        - - "photo-gallery"
          - !Select
            - 0
            - !Split
              - "-"
              - !Select
                - 2
                - !Split
                  - "/"
                  - !Ref "AWS::StackId"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders:
              - "*"
            AllowedMethods:
              - GET
              - PUT
              - POST
              - DELETE
              - HEAD
            AllowedOrigins:
              - "*"
            MaxAge: 3000

  # S3 Bucket for hosting frontend (private)
  FrontendBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      BucketName: !Join
        - "-"
        - - "gallery-frontend"
          - !Select
            - 0
            - !Split
              - "-"
              - !Select
                - 2
                - !Split
                  - "/"
                  - !Ref "AWS::StackId"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

  # S3 Bucket Cleanup Functions
  S3CleanupRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: S3CleanupPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:ListBucket
                  - s3:DeleteObject
                  - s3:DeleteObjectVersion
                  - s3:GetObjectVersion
                  - s3:ListBucketVersions
                Resource: 
                  - !Sub 'arn:aws:s3:::${PhotoStorageBucket}'
                  - !Sub 'arn:aws:s3:::${PhotoStorageBucket}/*'
                  - !Sub 'arn:aws:s3:::${FrontendBucket}'
                  - !Sub 'arn:aws:s3:::${FrontendBucket}/*'

  S3CleanupFunction:
    Type: AWS::Lambda::Function
    Properties:
      Handler: index.handler
      Role: !GetAtt S3CleanupRole.Arn
      Code:
        ZipFile: |
          import boto3
          import cfnresponse
          import logging
          import time

          logger = logging.getLogger()
          logger.setLevel(logging.INFO)

          def delete_bucket_contents(bucket_name):
              try:
                  logger.info(f"Starting cleanup of bucket: {bucket_name}")
                  s3 = boto3.client('s3')
                  
                  paginator = s3.get_paginator('list_object_versions')
                  pages = paginator.paginate(Bucket=bucket_name)
                  
                  delete_list = []
                  
                  try:
                      for page in pages:
                          if 'Versions' in page:
                              for version in page['Versions']:
                                  delete_list.append({
                                      'Key': version['Key'],
                                      'VersionId': version['VersionId']
                                  })
                          
                          if 'DeleteMarkers' in page:
                              for marker in page['DeleteMarkers']:
                                  delete_list.append({
                                      'Key': marker['Key'],
                                      'VersionId': marker['VersionId']
                                  })
                          
                          if delete_list:
                              logger.info(f"Deleting {len(delete_list)} objects")
                              s3.delete_objects(
                                  Bucket=bucket_name,
                                  Delete={'Objects': delete_list}
                              )
                              delete_list = []
                      
                      paginator = s3.get_paginator('list_objects_v2')
                      pages = paginator.paginate(Bucket=bucket_name)
                      
                      for page in pages:
                          if 'Contents' in page:
                              objects = [{'Key': obj['Key']} for obj in page['Contents']]
                              if objects:
                                  logger.info(f"Deleting {len(objects)} non-versioned objects")
                                  s3.delete_objects(
                                      Bucket=bucket_name,
                                      Delete={'Objects': objects}
                                  )
                      
                      logger.info(f"Successfully cleaned up bucket: {bucket_name}")
                      return True
                      
                  except Exception as e:
                      logger.error(f"Error during deletion: {str(e)}")
                      return False
                      
              except Exception as e:
                  logger.error(f"Error accessing bucket: {str(e)}")
                  return False

          def handler(event, context):
              logger.info('Received event: %s', event)
              response_data = {}
              
              try:
                  bucket_name = event['ResourceProperties']['BucketName']
                  
                  if event['RequestType'] == 'Delete':
                      max_attempts = 3
                      for attempt in range(max_attempts):
                          logger.info(f"Cleanup attempt {attempt + 1} of {max_attempts}")
                          if delete_bucket_contents(bucket_name):
                              break
                          if attempt < max_attempts - 1:
                              time.sleep(5)
                  
                  cfnresponse.send(event, context, cfnresponse.SUCCESS, response_data)
                  
              except Exception as e:
                  logger.error(f"Error in handler: {str(e)}")
                  cfnresponse.send(event, context, cfnresponse.FAILED, response_data)
      Runtime: python3.9
      Timeout: 300
      MemorySize: 256

  PhotoBucketCleanup:
    Type: Custom::S3Cleanup
    DependsOn: PhotoStorageBucket
    Properties:
      ServiceToken: !GetAtt S3CleanupFunction.Arn
      BucketName: !Ref PhotoStorageBucket

  FrontendBucketCleanup:
    Type: Custom::S3Cleanup
    DependsOn: FrontendBucket
    Properties:
      ServiceToken: !GetAtt S3CleanupFunction.Arn
      BucketName: !Ref FrontendBucket

  # Lambda Execution Role
  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: S3Access
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                  - s3:ListBucket
                Resource:
                  - !Sub '${PhotoStorageBucket.Arn}'
                  - !Sub '${PhotoStorageBucket.Arn}/*'

  # Lambda Functions for Photo Operations
  PhotoOperationsFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Join
        - "-"
        - - "photo-operations"
          - !Select
            - 0
            - !Split
              - "-"
              - !Select
                - 2
                - !Split
                  - "/"
                  - !Ref "AWS::StackId"
      Handler: index.lambda_handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Code:
        ZipFile: |
          import json
          import boto3
          import base64
          import uuid
          from datetime import datetime
          import os
          from botocore.config import Config

          current_region = os.environ.get('AWS_REGION', 'us-east-1')
        
          s3 = boto3.client(
              's3',
              region_name=current_region,
              config=Config(
                  signature_version='s3v4',
                  s3={'addressing_style': 'virtual'} # Ensures consistent hostname
              )
          )
          BUCKET_NAME = os.environ['PHOTO_BUCKET']

          def lambda_handler(event, context):
              print(f"Received event: {json.dumps(event)}")
              
              headers = {
                  'Access-Control-Allow-Origin': '*',
                  'Access-Control-Allow-Headers': 'Content-Type',
                  'Access-Control-Allow-Methods': 'GET,POST,DELETE,OPTIONS'
              }
              
              try:
                  http_method = event.get('httpMethod', '')
                  path = event.get('path', '')
                  
                  # Handle CORS preflight
                  if http_method == 'OPTIONS':
                      return {
                          'statusCode': 200,
                          'headers': headers,
                          'body': ''
                      }
                  
                  # Upload photo
                  if http_method == 'POST' and path == '/photos':
                      return upload_photo(event, headers)
                  
                  # List photos
                  elif http_method == 'GET' and path == '/photos':
                      return list_photos(headers)
                  
                  # Delete photo
                  elif http_method == 'DELETE' and path.startswith('/photos/'):
                      photo_key = path.split('/')[-1]
                      return delete_photo(photo_key, headers)
                  
                  # Get presigned URL for a photo
                  elif http_method == 'GET' and path.startswith('/photos/'):
                      photo_key = path.split('/')[-1]
                      return get_photo_url(photo_key, headers)
                  
                  return {
                      'statusCode': 404,
                      'headers': headers,
                      'body': json.dumps({'error': 'Not found'})
                  }
                  
              except Exception as e:
                  print(f"Error: {str(e)}")
                  return {
                      'statusCode': 500,
                      'headers': headers,
                      'body': json.dumps({'error': str(e)})
                  }

          def upload_photo(event, headers):
              try:
                  body = json.loads(event['body'])
                  
                  # Get image data and metadata
                  image_data = body.get('image')
                  filename = body.get('filename', f'photo-{uuid.uuid4()}.jpg')
                  content_type = body.get('contentType', 'image/jpeg')
                  
                  if not image_data:
                      return {
                          'statusCode': 400,
                          'headers': headers,
                          'body': json.dumps({'error': 'No image data provided'})
                      }
                  
                  # Decode base64 image
                  if ',' in image_data:
                      image_data = image_data.split(',')[1]
                  
                  image_bytes = base64.b64decode(image_data)
                  
                  # Sanitize filename for S3 metadata (must be ASCII only)
                  def sanitize_for_metadata(text):
                      # Remove or replace non-ASCII characters
                      return ''.join(char if ord(char) < 128 else '_' for char in text)
                  
                  safe_filename = sanitize_for_metadata(filename)
                  
                  # Generate unique key
                  photo_key = f"photos/{datetime.now().strftime('%Y/%m/%d')}/{uuid.uuid4()}-{filename}"
                  
                  # Upload to S3
                  s3.put_object(
                      Bucket=BUCKET_NAME,
                      Key=photo_key,
                      Body=image_bytes,
                      ContentType=content_type,
                      Metadata={
                          'uploaded-at': datetime.now().isoformat(),
                          'original-filename': safe_filename
                      }
                  )
                  
                  # Generate presigned URL for viewing
                  url = s3.generate_presigned_url(
                      'get_object',
                      Params={'Bucket': BUCKET_NAME, 'Key': photo_key},
                      ExpiresIn=604800  # 7 days
                  )
                  
                  return {
                      'statusCode': 200,
                      'headers': headers,
                      'body': json.dumps({
                          'message': 'Photo uploaded successfully',
                          'photoKey': photo_key,
                          'url': url
                      })
                  }
                  
              except Exception as e:
                  print(f"Upload error: {str(e)}")
                  return {
                      'statusCode': 500,
                      'headers': headers,
                      'body': json.dumps({'error': f'Upload failed: {str(e)}'})
                  }

          def list_photos(headers):
              try:
                  response = s3.list_objects_v2(
                      Bucket=BUCKET_NAME,
                      Prefix='photos/'
                  )
                  
                  photos = []
                  for obj in response.get('Contents', []):
                      # Generate presigned URL
                      url = s3.generate_presigned_url(
                          'get_object',
                          Params={'Bucket': BUCKET_NAME, 'Key': obj['Key']},
                          ExpiresIn=604800
                      )
                      
                      # Get metadata - handle cases where it might not exist
                      try:
                          metadata = s3.head_object(Bucket=BUCKET_NAME, Key=obj['Key'])
                          original_filename = metadata.get('Metadata', {}).get('original-filename', obj['Key'].split('/')[-1])
                      except Exception as e:
                          print(f"Error reading metadata for {obj['Key']}: {str(e)}")
                          original_filename = obj['Key'].split('/')[-1]
                      
                      photos.append({
                          'key': obj['Key'],
                          'url': url,
                          'size': obj['Size'],
                          'lastModified': obj['LastModified'].isoformat(),
                          'filename': original_filename
                      })
                  
                  # Sort by last modified, newest first
                  photos.sort(key=lambda x: x['lastModified'], reverse=True)
                  
                  return {
                      'statusCode': 200,
                      'headers': headers,
                      'body': json.dumps({
                          'photos': photos,
                          'count': len(photos)
                      })
                  }
                  
              except Exception as e:
                  print(f"List error: {str(e)}")
                  return {
                      'statusCode': 500,
                      'headers': headers,
                      'body': json.dumps({'error': f'Failed to list photos: {str(e)}'})
                  }

          def delete_photo(photo_key, headers):
              try:
                  # Decode URL-encoded key
                  import urllib.parse
                  photo_key = urllib.parse.unquote(photo_key)
                  
                  s3.delete_object(
                      Bucket=BUCKET_NAME,
                      Key=photo_key
                  )
                  
                  return {
                      'statusCode': 200,
                      'headers': headers,
                      'body': json.dumps({'message': 'Photo deleted successfully'})
                  }
                  
              except Exception as e:
                  print(f"Delete error: {str(e)}")
                  return {
                      'statusCode': 500,
                      'headers': headers,
                      'body': json.dumps({'error': f'Delete failed: {str(e)}'})
                  }

          def get_photo_url(photo_key, headers):
              try:
                  import urllib.parse
                  photo_key = urllib.parse.unquote(photo_key)
                  
                  url = s3.generate_presigned_url(
                      'get_object',
                      Params={'Bucket': BUCKET_NAME, 'Key': photo_key},
                      ExpiresIn=604800
                  )
                  
                  return {
                      'statusCode': 200,
                      'headers': headers,
                      'body': json.dumps({'url': url})
                  }
                  
              except Exception as e:
                  print(f"Get URL error: {str(e)}")
                  return {
                      'statusCode': 500,
                      'headers': headers,
                      'body': json.dumps({'error': str(e)})
                  }
      Runtime: python3.9
      Timeout: 30
      MemorySize: 256
      Environment:
        Variables:
          PHOTO_BUCKET: !Ref PhotoStorageBucket

  # API Gateway
  PhotoGalleryAPI:
    Type: AWS::ApiGateway::RestApi
    Properties:
      Name: !Join
        - "-"
        - - "photo-gallery-api"
          - !Select
            - 0
            - !Split
              - "-"
              - !Select
                - 2
                - !Split
                  - "/"
                  - !Ref "AWS::StackId"
      EndpointConfiguration:
        Types:
          - REGIONAL

  # /photos resource
  PhotosResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      ParentId: !GetAtt PhotoGalleryAPI.RootResourceId
      PathPart: photos
      RestApiId: !Ref PhotoGalleryAPI

  # /photos/{photoKey} resource
  PhotoKeyResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      ParentId: !Ref PhotosResource
      PathPart: '{photoKey}'
      RestApiId: !Ref PhotoGalleryAPI

  # Methods for /photos
  PhotosPostMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      AuthorizationType: NONE
      HttpMethod: POST
      ResourceId: !Ref PhotosResource
      RestApiId: !Ref PhotoGalleryAPI
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${PhotoOperationsFunction.Arn}/invocations

  PhotosGetMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      AuthorizationType: NONE
      HttpMethod: GET
      ResourceId: !Ref PhotosResource
      RestApiId: !Ref PhotoGalleryAPI
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${PhotoOperationsFunction.Arn}/invocations

  PhotosOptionsMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      AuthorizationType: NONE
      HttpMethod: OPTIONS
      ResourceId: !Ref PhotosResource
      RestApiId: !Ref PhotoGalleryAPI
      Integration:
        Type: MOCK
        IntegrationResponses:
          - StatusCode: 200
            ResponseParameters:
              method.response.header.Access-Control-Allow-Headers: "'Content-Type,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token'"
              method.response.header.Access-Control-Allow-Methods: "'GET,POST,DELETE,OPTIONS'"
              method.response.header.Access-Control-Allow-Origin: "'*'"
            ResponseTemplates:
              application/json: ''
        RequestTemplates:
          application/json: '{"statusCode": 200}'
      MethodResponses:
        - StatusCode: 200
          ResponseParameters:
            method.response.header.Access-Control-Allow-Headers: true
            method.response.header.Access-Control-Allow-Methods: true
            method.response.header.Access-Control-Allow-Origin: true

  # Methods for /photos/{photoKey}
  PhotoKeyGetMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      AuthorizationType: NONE
      HttpMethod: GET
      ResourceId: !Ref PhotoKeyResource
      RestApiId: !Ref PhotoGalleryAPI
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${PhotoOperationsFunction.Arn}/invocations

  PhotoKeyDeleteMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      AuthorizationType: NONE
      HttpMethod: DELETE
      ResourceId: !Ref PhotoKeyResource
      RestApiId: !Ref PhotoGalleryAPI
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${PhotoOperationsFunction.Arn}/invocations

  PhotoKeyOptionsMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      AuthorizationType: NONE
      HttpMethod: OPTIONS
      ResourceId: !Ref PhotoKeyResource
      RestApiId: !Ref PhotoGalleryAPI
      Integration:
        Type: MOCK
        IntegrationResponses:
          - StatusCode: 200
            ResponseParameters:
              method.response.header.Access-Control-Allow-Headers: "'Content-Type,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token'"
              method.response.header.Access-Control-Allow-Methods: "'GET,DELETE,OPTIONS'"
              method.response.header.Access-Control-Allow-Origin: "'*'"
            ResponseTemplates:
              application/json: ''
        RequestTemplates:
          application/json: '{"statusCode": 200}'
      MethodResponses:
        - StatusCode: 200
          ResponseParameters:
            method.response.header.Access-Control-Allow-Headers: true
            method.response.header.Access-Control-Allow-Methods: true
            method.response.header.Access-Control-Allow-Origin: true

  # API Deployment
  ApiDeployment:
    Type: AWS::ApiGateway::Deployment
    DependsOn:
      - PhotosPostMethod
      - PhotosGetMethod
      - PhotosOptionsMethod
      - PhotoKeyGetMethod
      - PhotoKeyDeleteMethod
      - PhotoKeyOptionsMethod
    Properties:
      RestApiId: !Ref PhotoGalleryAPI

  ApiStage:
    Type: AWS::ApiGateway::Stage
    Properties:
      DeploymentId: !Ref ApiDeployment
      RestApiId: !Ref PhotoGalleryAPI
      StageName: prod

  # Lambda Permissions
  LambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref PhotoOperationsFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${PhotoGalleryAPI}/*

  # Frontend Uploader
  FrontendUploaderRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: S3UploadPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:GetObject
                Resource: !Sub '${FrontendBucket.Arn}/*'

  FrontendUploaderFunction:
    Type: AWS::Lambda::Function
    DependsOn: ApiStage
    Properties:
      Handler: index.handler
      Role: !GetAtt FrontendUploaderRole.Arn
      Code:
        ZipFile: |
          import boto3
          import cfnresponse
          import logging
          from botocore.config import Config
          import os

          logger = logging.getLogger()
          logger.setLevel(logging.INFO)

          def handler(event, context):
              if event['RequestType'] in ['Create', 'Update']:
                  try:
                      current_region = os.environ.get('AWS_REGION', 'us-east-1')
        
                      s3 = boto3.client(
                          's3',
