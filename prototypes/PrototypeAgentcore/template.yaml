      Code:
        ZipFile: |
          import json
          import logging
          import urllib.request
          import traceback
          import boto3
          import os
          from botocore.config import Config

          log = logging.getLogger(__name__)
          log.setLevel(logging.INFO)

          def send_response(event, context, status, data=None, reason=None, physical_id=None):
              """Send response to CloudFormation"""
              try:
                  body = {
                      'Status': status,
                      'Reason': reason or f"See CloudWatch Log Stream: {getattr(context, 'log_stream_name', 'N/A')}",
                      'PhysicalResourceId': physical_id or getattr(context, 'log_stream_name', 'frontend-uploader'),
                      'StackId': event['StackId'],
                      'RequestId': event['RequestId'],
                      'LogicalResourceId': event['LogicalResourceId'],
                      'NoEcho': False,
                      'Data': data or {}
                  }
                  payload = json.dumps(body).encode('utf-8')
                  log.info(f"Sending response: {body}")
                  req = urllib.request.Request(
                      event['ResponseURL'], 
                      data=payload, 
                      method='PUT',
                      headers={'content-type': '', 'content-length': str(len(payload))}
                  )
                  with urllib.request.urlopen(req, timeout=30) as resp:
                      log.info(f"CFN response sent successfully: {resp.status}")
              except Exception as e:
                  log.error(f"Failed to send CFN response: {str(e)}")
                  log.error(traceback.format_exc())

          def handler(event, context):
              log.info(f"Received event: {json.dumps(event)}")
              
              try:
                  req_type = event.get('RequestType')
                  props = event.get('ResourceProperties', {})
                  bucket = props.get('BucketName')
                  
                  if not bucket:
                      send_response(event, context, 'FAILED', {}, 'BucketName not provided')
                      return
                  
                  current_region = os.environ.get('AWS_REGION', 'us-east-1')
        
                  s3 = boto3.client(
                      's3',
                      region_name=current_region,
                      config=Config(
                          signature_version='s3v4',
                          s3={'addressing_style': 'virtual'} # Ensures consistent hostname
                      )
                  )

                  if req_type in ('Create', 'Update'):
                      api_endpoint = props.get('ApiEndpoint', '')
                      log.info(f"Uploading to bucket: {bucket}, API endpoint: {api_endpoint}")
                      
                      html = f"""<!doctype html>
          <html><head>
            <meta charset="utf-8"/>
            <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
            <title>Strands Agent Code Editor</title>
            <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.45.0/min/vs/loader.min.js"></script>
            <style>
              html,body,#editor {{height:100%; margin:0; background:#1e1e1e}}
              .bar {{background:#252526; padding:12px; color:#d4d4d4; display:flex; gap:8px; align-items:center}}
              .btn {{padding:8px 12px; background:#0e639c; border:none; color:#fff; border-radius:4px; cursor:pointer}}
              .btn[disabled] {{opacity:.5; cursor:not-allowed}}
              #status {{position:fixed; top:8px; right:8px; background:#333; color:#fff; padding:8px 12px; border-radius:4px; display:none}}
              #wrap {{position:absolute; inset:48px 0 0 0}}
            </style>
          </head>
          <body>
            <div class="bar">
              <button id="load" class="btn" style="display:none">Load</button>
              <button id="deploy" class="btn" disabled style="margin-left: auto;">Save and Deploy</button>
              <span id="msg"></span>
            </div>
            <div id="wrap"><div id="editor"></div></div>
            <div id="status"></div>
            <script>
              const API = '{api_endpoint}';
              let editor, original = '';
              function toast(t){{const s=document.getElementById('status');s.textContent=t;s.style.display='block';setTimeout(()=>s.style.display='none',3000);}}
              require.config({{paths:{{vs:'https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.45.0/min/vs'}}}});
              require(['vs/editor/editor.main'], function(){{
                editor = monaco.editor.create(document.getElementById('editor'), {{
                  value: '',
                  language:'python', theme:'vs-dark', automaticLayout:true, minimap:{{enabled:true}},
                  wordWrap:'on', fontSize:14
                }});
                editor.onDidChangeModelContent(()=>{{
                  document.getElementById('deploy').disabled = (editor.getValue()===original);
                }});
              }});
              async function loadCode(){{
                const r = await fetch(`${{API}}/get-code`, {{method:'GET'}});
                if(!r.ok) throw new Error(await r.text());
                const data = await r.json();
                original = data.code; editor.setValue(data.code); toast('Loaded');
              }}
              async function deploy(){{
                const code = editor.getValue();
                const r = await fetch(`${{API}}/deploy-code`, {{method:'POST', headers:{{'Content-Type':'application/json'}}, body:JSON.stringify({{code}})}});
                if(!r.ok) throw new Error(await r.text());
                const data = await r.json(); original=code; document.getElementById('deploy').disabled=true; toast('Build started: '+data.buildId);
              }}
              document.getElementById('load').onclick=loadCode;
              document.getElementById('deploy').onclick=deploy;

              window.addEventListener('DOMContentLoaded', function() {{
                loadCode();
              }});
            </script>
          </body></html>"""
                      
                      # Upload/overwrite editor page
                      s3.put_object(Bucket=bucket, Key='index.html', Body=html.encode('utf-8'), ContentType='text/html')
                      log.info("Successfully uploaded index.html")
                      
                      # Presign for convenience (7 days)
                      presigned = s3.generate_presigned_url('get_object', Params={'Bucket': bucket, 'Key': 'index.html'}, ExpiresIn=604800)
                      log.info(f"Generated presigned URL: {presigned[:50]}...")
                      
                      send_response(event, context, 'SUCCESS', {'EditorURL': presigned})
                      return

                  if req_type == 'Delete':
                      # Best-effort cleanup; always send a response
                      try:
                          s3.delete_object(Bucket=bucket, Key='index.html')
                          log.info("Successfully deleted index.html")
                      except Exception as e:
                          log.warning(f"Delete index.html failed (may not exist): {e}")
                      send_response(event, context, 'SUCCESS', {})
                      return

                  # Fallback (unknown RequestType)
                  log.warning(f"Unknown RequestType: {req_type}")
                  send_response(event, context, 'SUCCESS', {})
                  
              except Exception as e:
                  log.error(f"Custom resource error: {str(e)}")
                  log.error(traceback.format_exc())
                  send_response(event, context, 'FAILED', {}, str(e))


