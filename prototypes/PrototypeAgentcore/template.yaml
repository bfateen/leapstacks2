  AgentCoreProxyRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: AgentCoreInvokePolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - bedrock-agentcore:InvokeAgentRuntime
                  # or bedrock-agent-runtime:InvokeAgentRuntime if you're on that API
                Resource: '*'   # you can later restrict to AgentCoreRuntime.AgentRuntimeArn

  AgentCoreProxyFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${AgentName}-agentcore-proxy'
      Runtime: python3.11
      Handler: index.handler
      Role: !GetAtt AgentCoreProxyRole.Arn
      Timeout: 30
      MemorySize: 256
      Environment:
        Variables:
          AGENT_RUNTIME_ARN: !GetAtt AgentCoreRuntime.AgentRuntimeArn
          REGION: !Ref AWS::Region
      Code:
        ZipFile: |
          import boto3, json, os, time
          import uuid

          client = boto3.client('bedrock-agentcore', region_name=os.environ['REGION'])
          # if you're using the older naming, use 'bedrock-agent-runtime'

          def _resp(code, body):
              return {
                  'statusCode': code,
                  'headers': {
                      'Content-Type': 'application/json',
                      'Access-Control-Allow-Origin': '*',
                      'Access-Control-Allow-Headers': 'Content-Type',
                      'Access-Control-Allow-Methods': 'POST,OPTIONS'
                  },
                  'body': json.dumps(body)
              }

          def handler(event, context):
              if event.get('httpMethod') == 'OPTIONS':
                  return _resp(200, {})

              try:
                  body = json.loads(event.get('body') or '{}')
              except Exception:
                  body = {}

              prompt = body.get('prompt', 'Hello! How can I help you today?')
              raw_session = body.get('sessionId') or f"web-session-{int(time.time())}"

              if len(raw_session) < 33:
                  raw_session = raw_session + "-" + uuid.uuid4().hex

              session_id = raw_session[:128]  # hard cap 

              payload = json.dumps({"prompt": prompt}).encode()

              resp = client.invoke_agent_runtime(
                  agentRuntimeArn=os.environ['AGENT_RUNTIME_ARN'],
                  runtimeSessionId=session_id,
                  payload=payload,
              )

              # Handle both streaming/non-streaming JSON
              if resp.get("contentType") == "application/json":
                  chunks = [c.decode("utf-8") for c in resp.get("response", [])]
                  data = json.loads("".join(chunks)) if chunks else {}
              else:
                  data = {"raw": "Non-JSON response from AgentCore Runtime"}

              return _resp(200, data)

  AgentCoreAPI:
    Type: AWS::ApiGateway::RestApi
    Properties:
      Name: !Sub '${AWS::StackName}-agentcore-api'
      EndpointConfiguration:
        Types: [REGIONAL]

  AgentCoreInvokeResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref AgentCoreAPI
      ParentId: !GetAtt AgentCoreAPI.RootResourceId
      PathPart: invoke

  AgentCoreInvokePostMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref AgentCoreAPI
      ResourceId: !Ref AgentCoreInvokeResource
      HttpMethod: POST
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub 'arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${AgentCoreProxyFunction.Arn}/invocations'



  AgentCoreInvokeOptions:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref AgentCoreAPI
      ResourceId: !Ref AgentCoreInvokeResource
      HttpMethod: OPTIONS
      AuthorizationType: NONE
      Integration:
        Type: MOCK
        RequestTemplates:
          application/json: '{"statusCode": 200}'
        IntegrationResponses:
          - StatusCode: 200
            ResponseParameters:
              method.response.header.Access-Control-Allow-Headers: "'Content-Type'"
              method.response.header.Access-Control-Allow-Methods: "'POST,OPTIONS'"
              method.response.header.Access-Control-Allow-Origin: "'*'"
      MethodResponses:
        - StatusCode: 200
          ResponseParameters:
            method.response.header.Access-Control-Allow-Headers: true
            method.response.header.Access-Control-Allow-Methods: true
            method.response.header.Access-Control-Allow-Origin: true

  AgentCoreAPIDeployment:
    Type: AWS::ApiGateway::Deployment
    DependsOn:
      - AgentCoreInvokePostMethod
      - AgentCoreInvokeOptions
    Properties:
      RestApiId: !Ref AgentCoreAPI
      StageName: prod

  AgentCoreProxyInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref AgentCoreProxyFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${AgentCoreAPI}/*'


  UploadChatFrontendHTML:
    Type: Custom::S3Upload
    DependsOn: 
      - FrontendChatBucket
      - AgentCoreAPI
    Properties:
      ServiceToken: !GetAtt FrontendChatUploaderFunction.Arn
      BucketName: !Ref FrontendChatBucket
      ApiEndpoint: !Sub https://${AgentCoreAPI}.execute-api.${AWS::Region}.amazonaws.com/prod/invoke

Outputs:

  FrontendURL:
    Description: URL for the AgentCore Chat Frontend
    Value: !GetAtt UploadChatFrontendHTML.SignedURL

  EditorApiInvokeUrl:
    Description: Base invoke URL for the editor API
    Value: !Sub 'https://${EditorAPI}.execute-api.${AWS::Region}.amazonaws.com/prod'

  EditorURL:
    Description: Pre-signed URL to open the editor page
    Value: !GetAtt UploadFrontend.EditorURL

  AutoUpdateEnabled:
    Description: 'Auto-update mechanism status'
    Value: 'ENABLED - Runtime updates automatically via EventBridge when new images are pushed'

  RuntimeStateTableName:
    Description: DynamoDB table tracking runtime state
    Value: !Ref RuntimeStateTable

  UpdaterFunctionName:
    Description: Lambda function that updates runtime
    Value: !Ref RuntimeUpdaterFunction

  EventBridgeRuleName:
    Description: EventBridge rule monitoring ECR
    Value: !Ref ECRImagePushRule

  AgentRuntimeArn:
    Description: ARN of the AgentCore Runtime
    Value: !GetAtt AgentCoreRuntime.AgentRuntimeArn
    Export:
      Name: !Sub '${AWS::StackName}-RuntimeArn'
    
  AgentRuntimeId:
    Description: ID of the AgentCore Runtime
    Value: !GetAtt AgentCoreRuntime.AgentRuntimeId
    Export:
      Name: !Sub '${AWS::StackName}-RuntimeId'
  
  AgentRuntimeVersion:
    Description: Version of the AgentCore Runtime
    Value: !GetAtt AgentCoreRuntime.AgentRuntimeVersion
    
    
  ECRRepositoryUri:
    Description: URI of the ECR repository
    Value: !GetAtt AgentECRRepository.RepositoryUri
    
  ContainerImageUri:
    Description: Full container image URI
    Value: !GetAtt TriggerBuild.ImageUri
    
  ExecutionRoleArn:
    Description: ARN of the execution role
    Value: !GetAtt AgentCoreExecutionRole.Arn
    
  CodeBuildProjectName:
    Description: Name of the CodeBuild project
    Value: !Ref AgentBuildProject
    
  InvokeCommandCLI:
    Description: AWS CLI command to invoke the agent
    Value: !Sub |
      aws bedrock-agent-runtime invoke-agent-runtime \
        --agent-runtime-id ${AgentCoreRuntime.AgentRuntimeId} \
        --payload '{"prompt": "Hello, how are you?"}' \
        --region ${AWS::Region} \
        response.json && cat response.json
  
  InvokeCommandPython:
    Description: Python code to invoke the agent
    Value: !Sub |
      import boto3, json
      client = boto3.client('bedrock-agent-runtime', region_name='${AWS::Region}')
      response = client.invoke_agent_runtime(
          agentRuntimeId='${AgentCoreRuntime.AgentRuntimeId}',
          payload=json.dumps({"prompt": "What is Amazon Bedrock?"})
      )
      print(json.loads(response['body'].read()))