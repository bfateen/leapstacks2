  # --------------------------------------------------------------------------------
  # 1. TRIGGER LAMBDA
  # --------------------------------------------------------------------------------
  TriggerFunction:
    Type: AWS::Lambda::Function
    Properties:
      Runtime: nodejs20.x
      Handler: index.handler
      Timeout: 10
      Role: !GetAtt TriggerLambdaRole.Arn
      Environment:
        Variables:
          CODEBUILD_PROJECT_NAME: !Ref EjectorBuildProject
      Code:
        ZipFile: |
          const { CodeBuildClient, StartBuildCommand } = require("@aws-sdk/client-codebuild");
          const client = new CodeBuildClient();

          exports.handler = async (event) => {
            // 1. Define CORS headers
            const headers = {
                'Access-Control-Allow-Origin': '*',
                'Access-Control-Allow-Headers': 'Content-Type,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token',
                'Access-Control-Allow-Methods': 'OPTIONS,POST'
            };

            // 2. Handle OPTIONS preflight (just in case)
            if (event.httpMethod === 'OPTIONS') {
                return { statusCode: 200, headers: headers, body: '' };
            }

            try {
              // 3. FIX: Parse the body correctly for Proxy Integration
              let body = {};
              if (event.body) {
                  body = typeof event.body === 'string' ? JSON.parse(event.body) : event.body;
              }

              const { stackName, githubToken, repoUrl } = body;
              
              if (!stackName || !githubToken || !repoUrl) {
                  throw new Error(`Missing inputs. Received: ${JSON.stringify(body)}`);
              }

              // 4. Construct authenticated URL (masking token in logs recommended in production)
              const authRepoUrl = repoUrl.replace("https://", "https://" + githubToken + "@");

              const command = new StartBuildCommand({
                projectName: process.env.CODEBUILD_PROJECT_NAME,
                environmentVariablesOverride: [
                  { name: 'TARGET_STACK', value: stackName, type: 'PLAINTEXT' },
                  { name: 'REPO_URL', value: authRepoUrl, type: 'PLAINTEXT' },
                  { name: 'GITHUB_TOKEN', value: githubToken, type: 'PLAINTEXT' } 
                ]
              });

              const data = await client.send(command);
              
              // 5. Return success with Headers
              return { 
                  statusCode: 200, 
                  headers: headers,
                  body: JSON.stringify({ message: "Eject started", buildId: data.build.id }) 
              };

            } catch (err) {
              console.error("Error:", err);
              // 6. Return error with Headers (prevents CORS blocks on errors)
              return { 
                  statusCode: 500, 
                  headers: headers,
                  body: JSON.stringify({ error: err.message }) 
              };
            }
          };

  # --------------------------------------------------------------------------------
  # 2. CODEBUILD PROJECT
  # --------------------------------------------------------------------------------
  EjectorBuildProject:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: !Sub "${AWS::StackName}-Worker"
      ServiceRole: !GetAtt CodeBuildRole.Arn
      Artifacts:
        Type: NO_ARTIFACTS
      Environment:
        Type: LINUX_CONTAINER
        ComputeType: BUILD_GENERAL1_SMALL
        Image: aws/codebuild/amazonlinux2-x86_64-standard:5.0
        EnvironmentVariables:
          - Name: GIT_USER_NAME
            Value: "LeapStacks2 bot"
          - Name: GIT_USER_EMAIL
            Value: "bot@leapstacks.dev"
          - Name: AWS_ACCOUNT_ID
            Value: !Ref AWS::AccountId
      Source:
        Type: NO_SOURCE
        # We use literal block style (|) and string concatenation to avoid !Sub errors
        BuildSpec: |
          version: 0.2
          phases:
            install:
              runtime-versions:
                nodejs: 18
              commands:
                - echo "Initialize Project..."
                - mkdir eject_workspace && cd eject_workspace
                - npm init -y
                - echo "Installing CDK Dependencies..."
                - npm install aws-cdk-lib constructs source-map-support
                - npm install --save-dev typescript ts-node @types/node
                - echo "Installing Helper Libraries..."
                - npm install @aws-sdk/client-lambda @aws-sdk/client-cloudformation adm-zip
                - cd ..
            build:
              commands:
                - set -e
                - echo "--- STARTING UNIVERSAL EJECT FOR STACK $TARGET_STACK ---"
                - cd eject_workspace
                
                # --- STEP 1: FETCH & PREPARE ---
                - echo "1. Fetching Template, Backend, Frontend, and CONFIG..."
                - |
                  cat <<'EOF' > generator.js
                  const fs = require('fs');
                  const path = require('path');
                  const https = require('https');
                  const { CloudFormationClient, GetTemplateCommand, DescribeStacksCommand } = require('@aws-sdk/client-cloudformation');
                  const { LambdaClient, GetFunctionCommand } = require('@aws-sdk/client-lambda');
                  const AdmZip = require('adm-zip');
                  const { execSync } = require('child_process');

                  const cfClient = new CloudFormationClient({ region: process.env.AWS_DEFAULT_REGION });
                  const lambdaClient = new LambdaClient({ region: process.env.AWS_DEFAULT_REGION });
                  const stackName = process.env.TARGET_STACK;

                  const SRC_DIR = path.join(__dirname, 'src');
                  if (!fs.existsSync(SRC_DIR)) fs.mkdirSync(SRC_DIR);

                  async function main() {
                    try {
                      // A. Fetch Template
                      console.log('Fetching CloudFormation template...');
                      const response = await cfClient.send(new GetTemplateCommand({ StackName: stackName }));
                      let templateBody = response.TemplateBody;
                      templateBody = templateBody.replace(/("?Type"?\s*:\s*"?)(Custom::[a-zA-Z0-9_]+)("?)/g, '$1AWS::CloudFormation::CustomResource$3');
                      fs.writeFileSync('template.yaml', templateBody);

                      // B. Fetch Stack Parameters
                      console.log('Fetching Stack Configuration (Parameters)...');
                      const descResponse = await cfClient.send(new DescribeStacksCommand({ StackName: stackName }));
                      const stackParams = descResponse.Stacks[0].Parameters || [];
                      const paramMap = {};
                      stackParams.forEach(p => {
                        paramMap[p.ParameterKey] = p.ParameterValue;
                      });

                      // C. List Resources
                      console.log('Listing stack resources...');
                      const resJson = execSync('aws cloudformation list-stack-resources --stack-name ' + stackName + ' --output json');
                      const resources = JSON.parse(resJson).StackResourceSummaries;
                      const lambdaResources = resources.filter(r => r.ResourceType === 'AWS::Lambda::Function');
                      const s3Resources = resources.filter(r => r.ResourceType === 'AWS::S3::Bucket');

                      const assetMap = {}; 
                      const bucketMap = {};

                      // D. Download Backend (Lambda)
                      for (const l of lambdaResources) {
                        try {
                          const data = await lambdaClient.send(new GetFunctionCommand({ FunctionName: l.PhysicalResourceId }));
                          const zipPath = path.join(SRC_DIR, l.LogicalResourceId + '.zip');
                          const extractPath = path.join(SRC_DIR, l.LogicalResourceId);
                          
                          await new Promise((resolve, reject) => {
                             https.get(data.Code.Location, res => {
                                const file = fs.createWriteStream(zipPath);
                                res.pipe(file);
                                file.on('finish', () => { file.close(resolve); });
                             });
                          });

                          const zip = new AdmZip(zipPath);
                          zip.extractAllTo(extractPath, true);
                          fs.unlinkSync(zipPath);
                          assetMap[l.LogicalResourceId] = l.LogicalResourceId;
                        } catch (e) {
                          console.warn('Skipping Lambda ' + l.LogicalResourceId + ': ' + e.message);
                        }
                      }

                      // E. Download Frontend (S3)
                      for (const bucket of s3Resources) {
                         const bucketName = bucket.PhysicalResourceId;
                         const logicalId = bucket.LogicalResourceId;
                         console.log('Downloading Frontend: ' + logicalId);
                         
                         const bucketDir = path.join(SRC_DIR, logicalId);
                         if (!fs.existsSync(bucketDir)) fs.mkdirSync(bucketDir);
                         try {
                           execSync('aws s3 sync s3://' + bucketName + ' ' + bucketDir + ' --quiet');
                           bucketMap[logicalId] = logicalId; 
                         } catch (e) {
                           console.warn('Could not sync bucket ' + bucketName + ': ' + e.message);
                         }
                      }

                      // F. Generate Files
                      generateCdkFiles(assetMap, bucketMap, paramMap);
                      generateReadme(stackName);

                    } catch (err) {
                      console.error('FATAL ERROR:', err);
                      process.exit(1);
                    }
                  }

                  function generateReadme(name) {
                    const readme = '# ' + name + ' (Ejected Stack)\n\n' +
                      '## 📂 Project Structure\n' +
                      '- **`template.yaml`**: Original Infrastructure definition.\n' +
                      '- **`src/`**: Live code (Backend & Frontend) downloaded from your deployment.\n' +
                      '- **`lib/stack.ts`**: The CDK wrapper that connects everything.\n\n' +
                      '## ⚙️ Configuration\n' +
                      'Your stack parameters (e.g., Environment, Instance Types) were captured at the time of export.\n' +
                      'They are currently hardcoded in `lib/stack.ts` inside the `parameters` block.\n';
                    fs.writeFileSync('README.md', readme);
                  }

                  function generateCdkFiles(assetMap, bucketMap, paramMap) {
                    const cdkJson = { "app": "npx ts-node bin/app.ts", "context": { "@aws-cdk/core:bootstrapQualifier": "hnb659fds" } };
                    fs.writeFileSync('cdk.json', JSON.stringify(cdkJson, null, 2));

                    const tsConfig = { "compilerOptions": { "target": "ES2018", "module": "commonjs", "lib": ["es2018"], "strict": true, "esModuleInterop": true } };
                    fs.writeFileSync('tsconfig.json', JSON.stringify(tsConfig, null, 2));

                    if (!fs.existsSync('bin')) fs.mkdirSync('bin');
                    
                    const appTs = '#!/usr/bin/env node\n' +
                      'import "source-map-support/register";\n' +
                      'import * as cdk from "aws-cdk-lib";\n' +
                      'import { EjectedStack } from "../lib/stack";\n' +
                      'const app = new cdk.App();\n' +
                      'new EjectedStack(app, "' + stackName + '", {\n' +
                      '  env: { account: process.env.CDK_DEFAULT_ACCOUNT, region: process.env.CDK_DEFAULT_REGION },\n' +
                      '});';
                    fs.writeFileSync('bin/app.ts', appTs);

                    if (!fs.existsSync('lib')) fs.mkdirSync('lib');
                    
                    const paramString = JSON.stringify(paramMap, null, 2);

                    let stackTs = 'import * as cdk from "aws-cdk-lib";\n' +
                      'import { Construct } from "constructs";\n' +
                      'import * as cfn_inc from "aws-cdk-lib/cloudformation-include";\n' +
                      'import * as lambda from "aws-cdk-lib/aws-lambda";\n' +
                      'import * as s3 from "aws-cdk-lib/aws-s3";\n' +
                      'import * as s3deploy from "aws-cdk-lib/aws-s3-deployment";\n' +
                      'import * as path from "path";\n\n' +
                      'export class EjectedStack extends cdk.Stack {\n' +
                      '  constructor(scope: Construct, id: string, props?: cdk.StackProps) {\n' +
                      '    super(scope, id, props);\n\n' +
                      '    // 1. Import Template with Captured Parameters\n' +
                      '    const template = new cfn_inc.CfnInclude(this, "Template", { \n' +
                      '      templateFile: "template.yaml",\n' +
                      '      parameters: ' + paramString + '\n' +
                      '    });\n';
                    
                    // Wire Lambdas
                    for (const [logicalId, folder] of Object.entries(assetMap)) {
                      stackTs += '\n' +
                      '    const ' + logicalId + ' = template.getResource("' + logicalId + '") as lambda.CfnFunction;\n' +
                      '    ' + logicalId + '.code = lambda.Code.fromAsset(path.join(__dirname, "../src/' + folder + '"));\n';
                    }

                    // Wire S3 Buckets
                    for (const [logicalId, folder] of Object.entries(bucketMap)) {
                      stackTs += '\n' +
                      '    // 2. Sync Frontend Content\n' +
                      '    const ' + logicalId + 'Bucket = template.getResource("' + logicalId + '") as s3.CfnBucket;\n' +
                      '    const ' + logicalId + 'L2 = s3.Bucket.fromBucketName(this, "' + logicalId + 'L2", ' + logicalId + 'Bucket.ref);\n' +
                      '    new s3deploy.BucketDeployment(this, "Deploy' + logicalId + '", {\n' +
                      '      sources: [s3deploy.Source.asset(path.join(__dirname, "../src/' + folder + '"))],\n' +
                      '      destinationBucket: ' + logicalId + 'L2,\n' +
                      '      prune: false, \n' +
                      '    });\n';
                    }

                    stackTs += '  }\n}';
                    fs.writeFileSync('lib/stack.ts', stackTs);
                    console.log('Generated CDK files successfully.');
                  }
                  main();
                  EOF
                - node generator.js

                # --- STEP 2: CREATE REPO ---
                - echo "2. Ensuring GitHub Repository exists..."
                - |
                  cat <<'EOF' > create-repo.js
                  const https = require('https');
                  const urlStr = process.env.REPO_URL.replace(/https:\/\/.*@/, 'https://');
                  const parts = urlStr.split('/');
                  const repoName = parts[parts.length - 1].replace('.git', '');
                  console.log('Target Repository Name:', repoName);

                  const options = {
                    hostname: 'api.github.com',
                    path: '/user/repos',
                    method: 'POST',
                    headers: {
                      'User-Agent': 'LEAP-Stacks-Ejector',
                      'Authorization': 'token ' + process.env.GITHUB_TOKEN,
                      'Content-Type': 'application/json'
                    }
                  };

                  const req = https.request(options, res => {
                    let data = '';
                    res.on('data', chunk => data += chunk);
                    res.on('end', () => {
                       console.log('GitHub API response:', res.statusCode);
                    });
                  });
                  req.on('error', console.error);
                  req.write(JSON.stringify({ name: repoName, private: true, description: "Ejected from LEAP Stacks" }));
                  req.end();
                  EOF
                - node create-repo.js
                
                # --- STEP 3: CI/CD & PUSH ---
                - echo "3. Configuring Git..."
                - mkdir -p .github/workflows
                - |
                  cat <<EOF > .github/workflows/deploy.yml
                  name: Deploy to AWS
                  on:
                    push:
                      branches: [ main ]
                  jobs:
                    deploy:
                      runs-on: ubuntu-latest
                      permissions:
                        id-token: write
                        contents: read
                      steps:
                        - name: Checkout Code
                          uses: actions/checkout@v3
                        - name: Configure AWS Credentials
                          uses: aws-actions/configure-aws-credentials@v2
                          with:
                            role-to-assume: arn:aws:iam::$AWS_ACCOUNT_ID:role/GitHubAction-DeployRole
                            aws-region: $AWS_DEFAULT_REGION
                        - name: Install & Deploy
                          run: |
                            npm install
                            npx cdk deploy --require-approval never
                  EOF
                
                - echo "4. Pushing to GitHub..."
                - git init
                - git config user.name "$GIT_USER_NAME"
                - git config user.email "$GIT_USER_EMAIL"
                - git checkout -b main
                - git add .
                - git commit -m "Ejected from LEAP Stacks (Hybrid Mode)"
                - git remote add origin $REPO_URL
                - git push -u origin main --force

  # --------------------------------------------------------------------------------
  # 3. IAM ROLES
  # --------------------------------------------------------------------------------
  TriggerLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: InvokeCodeBuild
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: codebuild:StartBuild
                Resource: !GetAtt EjectorBuildProject.Arn
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: "*"

  CodeBuildRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: codebuild.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: EjectPermissions
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - cloudformation:DescribeStacks
                  - cloudformation:ListStackResources
                  - cloudformation:GetTemplate
                  - lambda:GetFunction
                  - s3:ListBucket
                  - s3:GetObject
                Resource: "*"
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: "*"
  # --------------------------------------------------------------------------------
  # EXPORT API RESOURCES
  # --------------------------------------------------------------------------------

  ExportStackResource:
    Type: 'AWS::ApiGateway::Resource'
    Properties:
      RestApiId: !Ref ApiGatewayRestApi
      ParentId: !GetAtt ApiGatewayRestApi.RootResourceId
      PathPart: 'export-stack'

  ExportStackMethod:
    Type: 'AWS::ApiGateway::Method'
    Properties:
      RestApiId: !Ref ApiGatewayRestApi
      ResourceId: !Ref ExportStackResource
      HttpMethod: POST
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub 'arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${TriggerFunction.Arn}/invocations'

  ExportStackOptionsMethod:
    Type: 'AWS::ApiGateway::Method'
    Properties:
      AuthorizationType: NONE
      HttpMethod: OPTIONS
      ResourceId: !Ref ExportStackResource
      RestApiId: !Ref ApiGatewayRestApi
      Integration:
        IntegrationResponses:
          - StatusCode: 200
            ResponseParameters:
              method.response.header.Access-Control-Allow-Headers: "'Content-Type,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token'"
              method.response.header.Access-Control-Allow-Methods: "'OPTIONS,POST'"
              method.response.header.Access-Control-Allow-Origin: "'*'"
            ResponseTemplates:
              application/json: ''
        PassthroughBehavior: WHEN_NO_MATCH
        RequestTemplates:
          application/json: '{"statusCode": 200}'
        Type: MOCK
      MethodResponses:
        - StatusCode: 200
          ResponseParameters:
            method.response.header.Access-Control-Allow-Headers: true
            method.response.header.Access-Control-Allow-Methods: true
            method.response.header.Access-Control-Allow-Origin: true
          ResponseModels:
            application/json: 'Empty'

  LambdaApiGatewayInvokeTrigger:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !GetAtt TriggerFunction.Arn
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${ApiGatewayRestApi}/*'

Outputs:
  LoginUrl:
    Description: Click here to access your secure LEAP app
    Value: !Sub https://${Api}.execute-api.${AWS::Region}.amazonaws.com/prod/