                      'Error': str(e)
                  })

  

  # Cognito user creator
  CognitoUserCreatorRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: CognitoAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - cognito-idp:AdminCreateUser
                  - cognito-idp:AdminSetUserPassword
                Resource: !GetAtt UserPool.Arn

  CognitoUserCreator:
    Type: AWS::Lambda::Function
    Properties:
      Runtime: python3.11
      Handler: index.handler
      Role: !GetAtt CognitoUserCreatorRole.Arn
      Timeout: 30
      Code:
        ZipFile: |
          import boto3
          import cfnresponse
          import time
          
          def handler(event, context):
              try:
                  if event['RequestType'] in ['Create', 'Update']:
                      user_pool_id = event['ResourceProperties']['UserPoolId']
                      email = event['ResourceProperties']['AdminEmail']
                      password = event['ResourceProperties']['InitialPassword']
                      
                      cognito = boto3.client('cognito-idp')
                      
                      try:
                          cognito.admin_create_user(
                              UserPoolId=user_pool_id,
                              Username=email,
                              UserAttributes=[
                                  {'Name': 'email', 'Value': email},
                                  {'Name': 'email_verified', 'Value': 'true'}
                              ],
                              MessageAction='SUPPRESS'
                          )
                      except cognito.exceptions.UsernameExistsException:
                          print(f"User {email} already exists")
                      
                      time.sleep(2)
                      
                      cognito.admin_set_user_password(
                          UserPoolId=user_pool_id,
                          Username=email,
                          Password=password,
                          Permanent=True
                      )
                      
                      cfnresponse.send(event, context, cfnresponse.SUCCESS, {
                          'Message': f'User {email} configured successfully'
                      })
                  else:
                      cfnresponse.send(event, context, cfnresponse.SUCCESS, {})
                  
              except Exception as e:
                  print(e)
                  cfnresponse.send(event, context, cfnresponse.FAILED, {
                      'Error': str(e)
                  })

