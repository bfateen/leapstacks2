                            if(typeof downloadPrefilledQDeveloperScript === 'function') downloadPrefilledQDeveloperScript(id, stackName);
                        });
                        
                        var loadedDict = loadFromLocalStorage('myAppState');
                        if (loadedDict && (!isDataStale() || hasActivePrototypes())) {
                            if (isDataStale() && hasActivePrototypes()) console.log('Data is stale but active prototypes detected - using cached data');
