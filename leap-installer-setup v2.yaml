                    function showModalCustom(title, content) {
                        $('.models-table').hide();
                        $('.modal-popup').css('maxWidth','700px');
                        const overlay = document.getElementById('overlay');
                        const modalTitle = document.getElementById('modal-title');
                        const modalMessage = document.getElementById('modal-message');
                        modalTitle.textContent = title;
                        modalMessage.innerHTML = content;
                        overlay.style.display = 'block';
                    }

                    // FIX: Removed Backticks to prevent Fn::Sub errors
                    function showModal(title, message, models) {
                        $('.models-table').show();
                        $('.modal-popup').css('maxWidth', '600px');

                        const overlay = document.getElementById('overlay');
                        const modalTitle = document.getElementById('modal-title');
                        const modalMessage = document.getElementById('modal-message');
                        const modelsList = document.getElementById('models-list');

                        modalTitle.innerHTML = title;
                        modalMessage.textContent = message;
                        modelsList.innerHTML = '';

                        models.forEach(model => {
                            const row = document.createElement('tr');
                            
                            var statusClass = model.enabled ? 'status-enabled' : 'status-disabled';
                            var statusText = model.enabled ? 'Enabled' : 'Not Enabled';
                            var actionHtml = !model.enabled ? '<a href="' + model.url + '" target="_blank" class="enable-button">Enable</a>' : '';

                            // Use simple string concatenation
                            row.innerHTML = '<td>' + model.name + '</td>' +
                                '<td class="' + statusClass + '">' + statusText + '</td>' +
                                '<td>' + actionHtml + '</td>';
                                
                            modelsList.appendChild(row);
                        });

                        overlay.style.display = 'block';
                    }

                    function hideModal() {
                        if (hasaccess) document.getElementById('overlay').style.display = 'none';
                    }

                    // --- CORE FUNCTIONS ---

                    function GetServiceIcon(name) {
                        if (!fulldata || !fulldata['files']) return "";
                        for (var i=0;i<fulldata['files'].length;i++) {
                            if (fulldata['files'][i]['name']==name) return fulldata['files'][i]['public_url'];
                        }
                        return "";
                    }

