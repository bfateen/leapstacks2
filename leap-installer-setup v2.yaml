                    overflow: hidden;
                }

                .video-container img {
                    position: absolute;
                    top: 0;
                    left: 0;
                    width: 100%;
                    height: 100%;
                    object-fit: cover;
                }

                .cost-card {
                    background: linear-gradient(135deg, #0066cc, #0044aa);
                    color: white;
                }

                .total-cost {
                    /*font-size: 2rem;*/
