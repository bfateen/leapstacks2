  InitiateStackFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: InitiateStackFunction
      Handler: index.handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Code:
        ZipFile: |
          import json
          import boto3
          import uuid
          import logging
    
          import time
          from datetime import datetime
          import hashlib
          import os

          logger = logging.getLogger()
          logger.setLevel(logging.INFO)

          MODEL_PROFILE_CONFIG = {
            'amazon.nova-2-pro-v1:0': {
                'source_type': 'system_profile',
                'profile_id': 'us.amazon.nova-2-pro-v1:0'
            },
            'amazon.nova-2-lite-v1:0': {
                'source_type': 'system_profile',
                'profile_id': 'us.amazon.nova-2-lite-v1:0'
            },
            'amazon.nova-2-sonic-v1:0': {
                'source_type': 'system_profile',
                'profile_id': 'us.amazon.nova-2-sonic-v1:0'
            },
            'amazon.nova-2-micro-v1:0': {
                'source_type': 'system_profile',
                'profile_id': 'us.amazon.nova-2-micro-v1:0'
            },

            # --- Claude 3.7 & 4.5 ---
            'anthropic.claude-3-7-sonnet-20250219-v1:0': {
                'source_type': 'system_profile',
                'profile_id': 'us.anthropic.claude-3-7-sonnet-20250219-v1:0'
            },
            'anthropic.claude-sonnet-4-5-20250929-v1:0': {
                'source_type': 'system_profile',
                'profile_id': 'us.anthropic.claude-sonnet-4-5-20250929-v1:0'
            },
            'anthropic.claude-haiku-4-5-20251001-v1:0': {
                'source_type': 'system_profile',
                'profile_id': 'us.anthropic.claude-haiku-4-5-20251001-v1:0'
            },
            'anthropic.claude-3-5-sonnet-20241022-v2:0': {
                'source_type': 'system_profile',
                'profile_id': 'us.anthropic.claude-3-5-sonnet-20241022-v2:0'
            },
            'anthropic.claude-3-5-haiku-20241022-v1:0': {
                'source_type': 'system_profile',
                'profile_id': 'us.anthropic.claude-3-5-haiku-20241022-v1:0'
            },

            # --- Llama 3.2 & 3.3 (Must use System Profile for On-Demand) ---
            'meta.llama3-3-70b-instruct-v1:0': {
                'source_type': 'system_profile',
                'profile_id': 'us.meta.llama3-3-70b-instruct-v1:0'
            },
            'meta.llama3-2-90b-instruct-v1:0': {
                'source_type': 'system_profile',
                'profile_id': 'us.meta.llama3-2-90b-instruct-v1:0'
            },
            'meta.llama3-2-11b-instruct-v1:0': {
                'source_type': 'system_profile',
                'profile_id': 'us.meta.llama3-2-11b-instruct-v1:0'
            },
            'meta.llama3-2-3b-instruct-v1:0': {
                'source_type': 'system_profile',
                'profile_id': 'us.meta.llama3-2-3b-instruct-v1:0'
            },
            'meta.llama3-2-1b-instruct-v1:0': {
                'source_type': 'system_profile',
                'profile_id': 'us.meta.llama3-2-1b-instruct-v1:0'
            },
            # Llama 3.1 405B is typically cross-region only
            'meta.llama3-1-405b-instruct-v1:0': {
                'source_type': 'system_profile',
                'profile_id': 'us.meta.llama3-1-405b-instruct-v1:0'
            },

            # =========================================================
            # GROUP B: FOUNDATION MODELS
            # These support standard Regional On-Demand.
            # We create your App Profile by copying the regional foundation model ARN.
            # =========================================================
            
            # --- Older Claude 3 ---
            'anthropic.claude-3-sonnet-20240229-v1:0': {'source_type': 'foundation_model'},
            'anthropic.claude-3-haiku-20240307-v1:0': {'source_type': 'foundation_model'},
            'anthropic.claude-3-opus-20240229-v1:0': {'source_type': 'foundation_model'},
            'anthropic.claude-3-5-sonnet-20240620-v1:0': {'source_type': 'foundation_model'},

            # --- Llama 3.1 (8B and 70B are regional supported) ---
            'meta.llama3-1-70b-instruct-v1:0': {'source_type': 'foundation_model'},
            'meta.llama3-1-8b-instruct-v1:0': {'source_type': 'foundation_model'},
            'meta.llama3-70b-instruct-v1:0': {'source_type': 'foundation_model'},
            'meta.llama3-8b-instruct-v1:0': {'source_type': 'foundation_model'},

            # --- Amazon Nova ---
            'amazon.nova-pro-v1:0': {'source_type': 'foundation_model'},
            'amazon.nova-lite-v1:0': {'source_type': 'foundation_model'},
            'amazon.nova-micro-v1:0': {'source_type': 'foundation_model'},

            # --- Amazon Titan ---
            'amazon.titan-text-premier-v1:0': {'source_type': 'foundation_model'},
            'amazon.titan-text-express-v1': {'source_type': 'foundation_model'},
            'amazon.titan-text-lite-v1': {'source_type': 'foundation_model'}
          }

          def get_inference_profile_name(model_id, stack_name):
              """
              Generate a consistent, shortened profile name that fits within 64 character limit.
              Format: leap-{model-short}-{hash}
              Example: leap-claude-sonnet-92b23f7c1234
              """
              # Extract meaningful part of model name
              model_parts = model_id.replace('anthropic.', '').replace('amazon.', '')
              model_parts = model_parts.split('-')
              
              # Take first 2-3 meaningful parts
              if 'claude' in model_parts:
                  short_name = '-'.join([p for p in model_parts[:3] if p not in ['v1', 'v2', '0']])
              elif 'nova' in model_parts or 'titan' in model_parts:
                  short_name = '-'.join([p for p in model_parts[:2] if p not in ['v1', '0']])
              else:
                  short_name = '-'.join(model_parts[:2])
              
              # Create hash from full model_id and stack_name for uniqueness
              hash_input = f"{model_id}-{stack_name}"
              hash_suffix = hashlib.md5(hash_input.encode()).hexdigest()[:12]
              
              # Final name: leap-{short-model}-{hash} (max 64 chars)
              profile_name = f"leap-{short_name}-{hash_suffix}"
              
              # Ensure it's within limit
              if len(profile_name) > 64:
                  profile_name = profile_name[:64]
              
              return profile_name

          def list_existing_profiles(bedrock_client, profile_name):
              """
              Check if an inference profile with the given name already exists.
              Returns the profile ARN if found, None otherwise.
              """
              try:
                  response = bedrock_client.list_inference_profiles(
                      maxResults=100,
                      typeEquals='APPLICATION'
                  )
                  
                  for profile in response.get('inferenceProfileSummaries', []):
                      if profile.get('inferenceProfileName') == profile_name:
                          return profile.get('inferenceProfileArn')
                  
                  return None
              except Exception as e:
                  print(f"Error listing inference profiles: {str(e)}")
                  return None

          def create_inference_profile(bedrock_client, profile_name, model_id, stack_name, region):
              """
              Create an application inference profile for cost tracking.
              Correctly handles System Profile sources (Claude 3.7/4.x) vs Foundation Model sources.
              """
              try:
                  # Get configuration
                  config = MODEL_PROFILE_CONFIG.get(model_id, {'source_type': 'foundation_model'})
                  
                  # --- CRITICAL FIX: Construct the correct Source ARN ---
                  if config.get('source_type') == 'system_profile':
                      # For Claude 4+/3.7, we copy from the System Profile ARN
                      # e.g., arn:aws:bedrock:us-east-1::inference-profile/us.anthropic...
                      profile_id = config['profile_id']
                      if region.startswith('eu-') and profile_id.startswith('us.'):
                          profile_id = profile_id.replace('us.', 'eu.')
                      
                      source_arn = f"arn:aws:bedrock:{region}::inference-profile/{profile_id}"
                      print(f"Creating profile from System Profile source: {source_arn}")
                  else:
                      # For older models, we copy from the Foundation Model ARN
                      # e.g., arn:aws:bedrock:us-east-1::foundation-model/anthropic.claude-3...
                      source_arn = f"arn:aws:bedrock:{region}::foundation-model/{model_id}"
                      print(f"Creating profile from Foundation Model source: {source_arn}")
                  
                  response = bedrock_client.create_inference_profile(
                      inferenceProfileName=profile_name,
                      description=f"LEAP App Profile for {model_id}",
                      modelSource={
                          'copyFrom': source_arn
                      },
                      tags=[
                          {'key': 'ManagedBy', 'value': 'LEAP'},
                          {'key': 'StackName', 'value': stack_name},
                          {'key': 'ModelId', 'value': model_id},
                          {'key': 'CostCenter', 'value': stack_name}
                      ]
                  )
                  
                  profile_arn = response.get('inferenceProfileArn')
                  print(f"Successfully created custom profile: {profile_arn}")
                  return profile_arn
                  
              except Exception as e:
                  print(f"Error creating inference profile: {str(e)}")
                  
                  # Fallback: If creation fails, try to return the raw System Profile ARN as a safety net
                  if config.get('source_type') == 'system_profile':
                       print("Creation failed. Returning system profile directly as fallback.")
                       return source_arn
                       
                  return None

          def get_or_create_inference_profile(model_id, stack_name, region):
              """
              Always attempts to get or create a custom Application Inference Profile.
              """
              bedrock_client = boto3.client('bedrock', region_name=region)
              
              # 1. Generate consistent name
              profile_name = get_inference_profile_name(model_id, stack_name)
              
              # 2. Check if custom profile already exists
              existing_arn = list_existing_profiles(bedrock_client, profile_name)
              if existing_arn:
                  print(f"Using existing custom profile: {existing_arn}")
                  return existing_arn, profile_name, False
              
              # 3. Create new custom profile (Now works for all models!)
              print(f"Creating new custom profile: {profile_name}")
              new_arn = create_inference_profile(bedrock_client, profile_name, model_id, stack_name, region)
              
              if new_arn:
                  return new_arn, profile_name, True
              
              # 4. Ultimate Fallback (if creation really fails)
              config = MODEL_PROFILE_CONFIG.get(model_id, {})
              if config.get('source_type') == 'system_profile':
                  # Return the System Profile ARN directly so the app doesn't crash
                  pid = config['profile_id']
                  if region.startswith('eu-'): pid = pid.replace('us.', 'eu.')
                  return f"arn:aws:bedrock:{region}::inference-profile/{pid}", "SystemFallback", False
                  
              return None, None, False

          def handler(event, context):
              logger.info(f"Received event: {json.dumps(event)}")
              
              cloudformation = boto3.client('cloudformation')
              
              headers = {
                  'Access-Control-Allow-Origin': '*',
                  'Access-Control-Allow-Headers': 'Content-Type',
                  'Access-Control-Allow-Methods': 'OPTIONS,POST'
              }

              try:
                  body = json.loads(event['body'])
                  template_key = body.get('templateKey')
                  template_bucket = body.get('templateBucket')
                  replacements = body.get('replacements', [])
                  model_id = body.get('model_id', None)

                  stack_name = f"leapstack{uuid.uuid4().hex[:8]}"
                  region = os.environ.get('AWS_REGION', 'us-east-1')

                  #set up model or inference profile

                  # Get or create inference profile for cost tracking
                  inference_profile_arn = None
                  used_inference_profile = False
                  
                  try:
                      profile_arn, profile_name, was_created = get_or_create_inference_profile(
                          model_id=model_id,
                          stack_name=stack_name,
                          region=region
                      )
                      
                      if profile_arn:
                          inference_profile_arn = profile_arn
                          used_inference_profile = True
                          model_identifier = profile_arn
                          print(f"Using inference profile for invocation: {profile_arn}")
                          if was_created:
                              print(f"Created new profile: {profile_name}")
                      else:
                          # Fall back to direct model ID
                          model_identifier = model_id
                          print(f"Using direct model ID (no profile support): {model_id}")
                          
                  except Exception as profile_error:
                      # If profile creation fails, fall back to direct model invocation
                      print(f"Profile creation failed, using direct model: {str(profile_error)}")
                      model_identifier = model_id

                  modrep = {'Target': 'USERSELMODEL', 'Replacement': model_identifier}
                  replacements.append(modrep)

                  #len(replacements)
                  if len(replacements):
                      template_body=''
                      # Read content from S3
                      try:
                          s3 = boto3.client('s3')
                          response = s3.get_object(Bucket=template_bucket, Key=template_key)
                          
                          # Handle large files by streaming
                          chunk_size = 1024 * 1024  # 1MB chunks
                          content = []
                          stream = response['Body']
                          
                          for chunk in iter(lambda: stream.read(chunk_size), b''):
                              content.append(chunk)
                          
                          template_body = b''.join(content).decode('utf-8')
                          
                          result = template_body
                          
                          # Perform replacements
                          for item in replacements:
                              
                              target = item.get('Target', '')
                              replacement = item.get('Replacement', '')
                              
                              if target:
                                  # Count occurrences before replacement
                                  occurrences = result.count(target)
                                  
                                  # Perform replacement
                                  print(f"Replacing {target} with {replacement}")
                                  new_result = result.replace(target, replacement)
                                  
                                  result = new_result
                          
                          #template_body=result
                          s3.put_object(
                              Bucket=template_bucket,
                              Key=template_key,
                              Body=result.encode('utf-8')
                          )

                          
                      except Exception as e:
                          
                          return {
                              'statusCode': 404,
                              'body': f"error: {e}"
                          }
                          
                      #stack_params = {
                      #    'TemplateBody': template_body
                      #}
                      stack_params = {
                          'TemplateURL': f'https://{template_bucket}.s3.amazonaws.com/{template_key}'
                      }

                  elif template_key and template_bucket:
                      stack_params = {
                          'TemplateURL': f'https://{template_bucket}.s3.amazonaws.com/{template_key}'
                      }
                  else:
                      raise ValueError("Either templateBody or templateKey+templateBucket must be provided")

                  
                  logger.info(f"Creating stack: {stack_name}")
                  
                  stack_params.update({
                      'StackName': stack_name,
                      'Capabilities': ['CAPABILITY_NAMED_IAM','CAPABILITY_NAMED_IAM','CAPABILITY_AUTO_EXPAND']
                  })
                  
          
                  response = cloudformation.create_stack(**stack_params)

                  logger.info(f"Stack creation initiated: {response['StackId']}")

                  return {
                      'statusCode': 200,
                      'headers': headers,
                      'body': json.dumps({
                          'message': 'Stack creation initiated',
                          'stackId': response['StackId'],
                          'stackName': stack_name
                      })
                  }
              except Exception as e:
                  logger.error(f"Error: {str(e)}")
                  return {
                      'statusCode': 500,
                      'headers': headers,
                      'body': json.dumps({'error': str(e)})
                  }
