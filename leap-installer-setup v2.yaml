                                '<video width="315" height="315" controls autoplay><source src="'+ GetServiceIcon(item['videoURL']) +'" type="video/mp4"></video>';
                            
                            $('.accordion').append('<div class="accordion-item" data-eid="' + index + '"><div class="accordion-header">' + item['name'] + '</div><div class="accordion-content"><div class="video-container">' + content + '<p>' + item['description'] + '</p><p>'+doclinks+'</p><a href="#" class="delacc" style="float:right;position:relative;top:-10px;">🗑️</a></div></div></div>');
                            $(".accordion-item[data-eid='" + index + "']").find('.accordion-header').click();
                        }
                    }

                    function ShowPrototypeVideo(index) {        
                        document.querySelectorAll('video').forEach(video => { video.pause(); });            
                        var item = prototypes[index];
                        var idx = 'p_'+index;
                        if ($(".accordion-item[data-eid='" + idx + "']").length) {
                            $(".accordion-item[data-eid='" + idx + "']").find('.accordion-header').click();
                        } else {
                            var content = item['videoUrl'] && item['videoUrl'].toLowerCase().includes('youtube') ?
                                '<iframe width="360" height="215" src="' + item['videoUrl'] + '&autoplay=1" title="YouTube" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>' :
                                '<video width="315" height="315" controls autoplay><source src="' + item['videoUrl'] + '" type="video/mp4"></video>';
                            
                            $('.accordion .accordion-item:eq(0)').append('<div class="accordion-item" data-eid="' + idx + '"><div class="accordion-header">' + item['title'] + '</div><div class="accordion-content"><div class="video-container">' + content + '<p>Creating resources for ' + item['description'] + '</p><a href="#" class="delacc" style="float:right;position:relative;top:-10px;">🗑️</a></div></div></div>');
                            $(".accordion-item[data-eid='" + idx + "']").find('.accordion-header').click();
                        }
                    }

                    function getRandomFloat(min, max) { return Math.random() * (max - min) + min; }     
                    function setCookie(name, value, days) { const expires = new Date(); expires.setTime(expires.getTime() + (days * 24 * 60 * 60 * 1000)); document.cookie = name + '=' + value + ';expires=' + expires.toUTCString() + ';path=/'; }
                    function getCookie(name) { const nameEQ = name + '='; const ca = document.cookie.split(';'); for(let i = 0; i < ca.length; i++) { let c = ca[i]; while (c.charAt(0) == ' ') c = c.substring(1, c.length); if (c.indexOf(nameEQ) == 0) return c.substring(nameEQ.length, c.length); } return null; }
                    function isDataStale() { const dt = getCookie('leap_data_timestamp'); if (!dt) return true; return ((new Date() - new Date(parseInt(dt))) / (1000 * 60 * 60 * 24)) > 6; }
                    function hasActivePrototypes() { if (!prototypes || prototypes.length === 0) return false; return prototypes.some(p => p.active === true); }
                    const saveToLocalStorage = (key, val) => { try { localStorage.setItem(key, JSON.stringify(val)); return true; } catch (e) { return false; } };
                    const loadFromLocalStorage = (key) => { try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : null; } catch (e) { return null; } };

                    $(document).ready(() => {
                        var currentExportStack = '';
                        var currentExportId = '';

                        $(document).on('click', '.close-variable-modal', function(e) {
                            e.preventDefault();
                            $('#variable-input-overlay').fadeOut();
                            pendingLaunchId = null;
                        });

