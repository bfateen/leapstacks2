                              logger.error(f"Stack creation failed: {response_body['error']}")
                              break

                  return {
                      'statusCode': 200,
                      'headers': headers,
                      'body': json.dumps(response_body)
                  }

              except Exception as e:
                  logger.error(f"Error: {str(e)}")
                  return {
