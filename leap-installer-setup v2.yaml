                        $(document).on('click', '#editmodels', function(e) { e.preventDefault(); showModal("Model Access  <button class='refreshmodels' style='float:right'>Refresh</button>", "You need to have access to at least one model to continue.", fulldata["models_access"]); });
                        $(document).on('click', '.refreshmodels', function () { $('.refreshmodels').html('Reloading model access...'); fetchGithubRepoData(); });
                        
                        $(document).on('click', '.launchbut', function() {
                            if (launching) { alert('Please wait until current launch completes...'); return; }
                            if (!$(this).parent().find('.deployment-info').is(':visible')) {
                                const id = $(this).data('id');
                                deployPrototype(id);
                            }
                        });

                    $(document).on('click', '.deletebut', function() {
                        if (deleting) { alert('Please wait until current delete completes...'); return; }
                        deleting=true;
                        var id = $(this).data('id');
                        var stackname = $(".prototype-card[data-id='"+id+"']").attr('data-stackname');
                        deleteStack(stackname,id);
                    });
        
                        $(document).on('click', '.service-node', function() {
                            var pindex = $(this).data('index');
                            var service = $(this).data('service');
                            var outputs = prototypes[pindex].outputs;
                            var url = '';
                            if (service === 's3' && outputs.S3BucketName) url = "https://s3.console.aws.amazon.com/s3/buckets/" + outputs.S3BucketName;
                            else if (service === 'lambda' && outputs.LambdaFunctionName) url = "https://console.aws.amazon.com/lambda/home?region=${AWS::Region}#/functions/" + outputs.LambdaFunctionName;
                            else if (service === 'apigateway' && outputs.ApiEndpoint) url = "https://console.aws.amazon.com/apigateway/home?region=${AWS::Region}#/apis/" + outputs.ApiEndpoint;
                            else if (service === 'bedrock') url = "https://us-east-1.console.aws.amazon.com/bedrock/home" ;
                            if (url) window.open(url, '_blank').focus();
                        });

                        $(document).on('click', '.explainer-link', function() { ShowExplainer($(this).data('index')); });
                        $(document).on('click', '.prototype-demo-video', function () { ShowPrototypeVideo(parseInt($(this).data('index'))-1); });
                    });
                </script>
            </body>
            </html>

