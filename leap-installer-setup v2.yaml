                            formData.forEach(function(item) {
                                customReplacements.push({ Target: item.name, Replacement: item.value });
                            });
                            $('#variable-input-overlay').fadeOut();
                            triggerLaunchProcess(pendingLaunchId, customReplacements);
                            pendingLaunchId = null;
                        }); 

                        $(document).on('click', '.export-trigger-btn', function(e) {
                            e.preventDefault();
                            currentExportStack = $(this).data('stack');
                            currentExportId = $(this).data('id');
                            $('#export-status').hide().text('');
                            $('#gh-token').val('');
                            $('#gh-repo').val('');
                            $('#export-overlay').fadeIn();
                        });

                        $(document).on('click', '.close-export-modal', function(e) {
                            e.preventDefault();
                            $('#export-overlay').fadeOut();
                        });

                        $(document).on('click', '#confirm-export-btn', function(e) {
                            e.preventDefault();
                            const token = $('#gh-token').val().trim();
                            const repo = $('#gh-repo').val().trim();
                            const statusDiv = $('#export-status');
                            const btn = $(this);

                            if(!token || !repo) { alert('Please provide both a Token and Repository URL'); return; }

                            btn.prop('disabled', true).text('Initiating...');
                            statusDiv.show().text('Triggering export process...');

                            const apiUrl = 'https://${ApiGatewayRestApi}.execute-api.${AWS::Region}.amazonaws.com/prod/export-stack';

                            fetch(apiUrl, {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({ stackName: currentExportStack, githubToken: token, repoUrl: repo })
                            })
                            .then(response => response.json())
                            .then(data => {
                                if(data.statusCode === 200 || data.message) {
                                    statusDiv.html('Export started successfully!<br>Build ID: ' + (data.buildId || 'N/A') + '<br>Check your GitHub repo in a few minutes.');
                                    btn.text('Done');
                                    setTimeout(() => { $('#export-overlay').fadeOut(); btn.prop('disabled', false).text('Start Export'); }, 3000);
                                } else { throw new Error(data.body || 'Export failed'); }
                            })
                            .catch(err => {
                                statusDiv.css('color', 'red').text('Error: ' + err.message);
